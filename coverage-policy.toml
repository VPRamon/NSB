# NSB coverage policy — single source of truth for CI-consumed thresholds.
#
# Do not lower floors merely to make a pull request pass. Raise them only after
# a reproduced measurement on the intended base, with the command recorded below.
# Function and region figures are diagnostic; only line floors are blocking.
# Line percentages below are from LLVM LCOV (`DA:line,hits`). Function/region
# percentages are from the companion llvm-cov JSON export.

schema_version = 1

# Final release baseline after #121 (API freeze), #122 (obsolete cleanup), and
# #123 (test-suite audit). Replaces the provisional-pre-audit baseline from #127.
baseline_kind = "release-post-audit"

html_artifact_name = "coverage-html"
json_artifact_name = "coverage-json"
cobertura_artifact_name = "coverage-cobertura"
lcov_artifact_name = "coverage-lcov"

[baseline]
# Source tree that was instrumented for this measurement (tests land first;
# this policy-only commit does not change instrumented production lines).
commit = "455a069a71d967d865ed5f58caeb32469ae742e5"
date = "2026-09-05"
rust_nightly = "1.100.0-nightly (5db7f4be8 2026-09-01)"
rust_nightly_toolchain = "nightly-2026-09-02"
cargo_llvm_cov = "0.9.0"
command = "cargo +nightly-2026-09-02 llvm-cov --workspace --all-features --doctests --locked --no-report"

[measured]
workspace_lines = 81.35
workspace_functions = 75.69
workspace_regions = 79.14
nsb_lines = 88.23
nsb_functions = 86.64
nsb_regions = 89.19
nsb_cli_lines = 89.46
nsb_cli_functions = 88.98
nsb_cli_regions = 86.45
nsb_data_tools_lines = 79.49
nsb_data_tools_functions = 72.09
nsb_data_tools_regions = 76.46

# Blocking floors. About 1.2–1.4 percentage points below the reproduced LCOV
# line coverage so immaterial reporting jitter does not fail CI.
[floors]
workspace_lines = 80.0
nsb_lines = 87.0

[diff]
changed_production_lines = 90.0
base_ref = "origin/main"

# No filename or region exclusions are currently approved. A nonempty
# `files` list is rejected at load time so it cannot be silently ignored.
[exclusions]
files = []
notes = "No coverage exclusions. Do not exclude a crate or production module to manufacture a passing percentage."
