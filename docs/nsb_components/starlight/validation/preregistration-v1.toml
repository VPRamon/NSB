schema_version = 1
issue = 87

title = "Independent validation of the integrated 300-650 nm Starlight candidate map"

band_nm = [300, 650]
flux_unit = "ph_m-2_s-1"

metrics = [
  "signed_bias",
  "absolute_bias",
  "relative_bias",
  "mae",
  "median_absolute_error",
  "rmse",
  "relative_error_p50",
  "relative_error_p68",
  "relative_error_p95",
  "coverage_68",
  "coverage_95",
  "outlier_fraction",
]

notes = """
Technical scaffolding for issue #87. This document, `references-v1.toml`, and
`regions-v1.json` are frozen before any acquired reference is compared
against the candidate map, so that thresholds and region definitions cannot
be tuned to make a specific candidate pass after the fact. This literature
audit is not itself the production-science gate; that gate is the separately
checksum-pinned external cross-validation artifact. Issue #103 remains the
redistribution/licensing decision only.
"""

# The tolerances below are taken verbatim from GitHub issue #87 and are frozen
# before any acquired reference is compared against the candidate map. They
# must not be adjusted after seeing results from `dataset starlight
# validation run`. Any change requires a new `schema_version` and a fresh
# issue discussion, not an edit to this file in place.

[candidate]
# This repository-relative path is an admission input, not a bundled NSB 0.1.0
# asset. Each validation run must supply the exact candidate file and SHA-256.
map_path = "generated/starlight-candidate.csv"
map_schema = "nsb-healpix-starlight-candidate-v1"
checksum_pinning_status = "per-candidate-required"
checksum_note = "Pin the generated candidate SHA-256 via --candidate-map-sha256 on every validation run; do not substitute a released runtime map."

[tolerances]
# Preregistered technical gates, copied verbatim from issue #87:
#   absolute_all_sky_bias <= 0.03
#   median_absolute_regional_relative_error <= 0.05
#   regional_relative_error_p95 <= 0.10
#   coverage_68 in [0.63, 0.73]
#   coverage_95 in [0.90, 0.98]
absolute_all_sky_bias_max = 0.03
median_absolute_regional_relative_error_max = 0.05
regional_relative_error_p95_max = 0.10
coverage_68_min = 0.63
coverage_68_max = 0.73
coverage_95_min = 0.90
coverage_95_max = 0.98

# Exclusion rules are intentionally placeholders in this first PR: no
# reference has been acquired yet, so no exclusion has been exercised against
# real data. Do not mark a rule "active" without a linked justification and a
# `run` invocation demonstrating its effect.
[[exclusion_rules]]
id = "catastrophic-outlier-placeholder"
description = "Reserved for a future rule excluding individual reference pixels with implausible input (e.g. saturated or flagged upstream photometry) from bias/RMSE aggregation. Not active: no acquired reference has been inspected for such flags yet."
status = "placeholder"

[[exclusion_rules]]
id = "seam-pixel-double-count-placeholder"
description = "Reserved for a future rule excluding pixels within one HEALPix resolution element of the 0/360 degree galactic-longitude seam from region-specific (not all-sky) aggregation, in case a reference grid's own seam handling introduces a systematic near the boundary. Not active pending acquired reference data."
status = "placeholder"
