schema_version = 1

# At least one reference is acquired, so this flag is false. Remaining
# scientific admissibility (starlight-only vs mixed sky) is decided at
# transform time, not by this flag.
acquisition_required = false

notes = """
Three literature targets are acquired with verified SHA-256:

- Toller 1981 / Toller et al. 1987 Galactic-pole Pioneer 10 photometry,
  transcribed from Leinert et al. 1998 Table 34. The measurement is
  ISL+DGL+EBL (zodiacal light absent). Transform marks it not admissible
  as a starlight-only grid.
- Leinert et al. 1998 integrated-starlight analytical model constants,
  transcribed from the published A&AS text. Transform marks it not
  admissible: the paper quotes five S10 anchors for a two-dimensional
  Gaussian but does not publish the Gaussian parameters needed to
  reconstruct that surface.
- Masana et al. 2021 GAMBONS: the arXiv PDF (2101.01500) is acquired as
  the public machine-downloadable artifact. The GAMBONS website map mixes
  ISL with DGL, EBL, zodiacal light and airglow, so transform marks it
  not admissible as a Galactic starlight-only TOA 300-650 nm grid.

Checksums below were computed from the acquired files; none are invented.
No admissible starlight-only comparison grid is available yet; `validation
run` therefore reports not-admissible statuses rather than fabricating
metrics. GAMBONS shares Gaia as an input catalogue and must never be
treated as fully independent ground truth.
"""

[[references]]
id = "toller-1981-pioneer-background-starlight"
citation = "Toller, G. N. 1981, PhD dissertation, \"A Study of Galactic Light, Extragalactic Light, and Galactic Structure Using Pioneer 10 Observations of Background Starlight,\" State University of New York at Albany (see also Weinberg et al. 1974, J. Geophys. Res., 79, 3665; Toller et al. 1987; tabulated in Leinert et al. 1998 Table 34)"
description = "Pioneer 10/11 Imaging Photopolarimeter background-starlight brightness after the spacecraft passed beyond the zodiacal dust cloud (heliocentric distance >= 3 AU). This acquisition is the Galactic-pole blue (440 nm) tabulation reprinted in Leinert et al. 1998 Table 34. Measured by a photometer, independent of Gaia."
coverage = "galactic-poles"
wavelength_band_nm = [395.0, 485.0]
spectral_quantity = "total background starlight (ISL+DGL+EBL) in S10 units; zodiacal light absent"
transformation_to_target = "not-admissible: DGL and EBL are inseparable from ISL in the Pioneer FOV; see transforms.rs Admissibility::NotAdmissible"
license = "facts transcribed from a published A&AS table; original dissertation redistribution terms remain with SUNY Albany / NASA STI"
status = "acquired"
sha256 = "41871c3273f644aedd2b657b1fbd6f0cbe454e709c5ff08bf91a3902928d26ff"
filename = "toller1981-pioneer-background-starlight.csv"
acquisition_notes = "Local transcription of Leinert et al. 1998 Table 34 Pioneer 10 Galactic-pole values. Re-run acquire with --source pointing at docs/nsb_components/starlight/validation/acquired/toller1981-pioneer-background-starlight.csv"

[[references]]
id = "leinert-1998-diffuse-night-sky-brightness"
