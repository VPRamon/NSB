description = "GAMBONS natural night-sky model. The acquired file is the public arXiv PDF. The all-sky product mixes Gaia/Hipparcos ISL with DGL, EBL, zodiacal light and airglow (https://gambons.fqa.ub.edu). Retained for pipeline cross-validation documentation only; shares Gaia as an input catalogue."
