description = "Published integrated-starlight analytical model (Elsässer & Haug 1960 isophotes + Roach & Megill 1961 high-latitude star counts) independent of Gaia. CDS catalogue J/A+AS/127/1 distributes IRAS cirrus FITS, not this optical ISL model, so the model constants are transcribed from the article text."
coverage = "all-sky"
wavelength_band_nm = [300.0, 700.0]
spectral_quantity = "integrated starlight radiance in S10 units (analytical model)"
transformation_to_target = "not-admissible: published Leinert ISL model is a two-dimensional Gaussian whose amplitudes/widths are not printed; inventing an interpolation from the five quoted S10 anchors is not the registered model"
license = "ESO / A&A copyright on the article; numerical model constants transcribed as scientific facts"
status = "acquired"
sha256 = "3296cb20ff7398045afc5e691b45e72590165b88c859d5782bc7908952ba5dc6"
filename = "leinert1998-diffuse-night-sky-brightness.csv"
acquisition_notes = "Local transcription of the published ISL model constants. Re-run acquire with --source pointing at docs/nsb_components/starlight/validation/acquired/leinert1998-diffuse-night-sky-brightness.csv"

