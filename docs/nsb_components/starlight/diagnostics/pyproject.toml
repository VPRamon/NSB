[project]
name = "starlight-diagnostics"
version = "0.1.0"
description = "Optional visualization helpers for Starlight HEALPix candidate maps"
requires-python = ">=3.11"
dependencies = [
    "healpy>=1.17",
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.scripts]
starlight-heatmap = "generate_starlight_heatmap:main"
