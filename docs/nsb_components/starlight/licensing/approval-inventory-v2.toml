# Starlight redistribution artifact inventory (schema v1)
#
# Technical scope of #88 (parent tracker #103). This inventory lists every
# input, generated artifact, sidecar, manifest, and report that participates
# in the Starlight 300-650 nm candidate so a fail-closed reviewer, and later
# promotion validation (see the Rust contract in
# crates/nsb-data-tools/src/starlight/licensing.rs), can enumerate exactly
# what is distributed today, on which channel, and under which licence.
#
# This file records facts only. It does not grant redistribution approval.
# The human decision is recorded separately in
# redistribution-review-decision-v1.json and stays owned by #103.
#
# Field semantics:
#   id                    stable identifier, referenced by the decision file
#   category              free-text classification (upstream bulk product,
#                         upstream reference dataset, generated derived
#                         output, manifest, report, ...)
#   source                origin/provenance description
#   release               upstream release, artifact version, or candidate tag
#   license               source grant or explicit NOT-VERIFIED terms; must not
#                         manufacture upstream permissions from a URL
#   license_url           optional canonical licence reference
#   sha256                exact byte digest, required for every distributed
#                         artifact (including documentation) and planned product
#   superseded_by_sha256  optional digest of a replacement artifact that has
#                         not yet been integrated into a published candidate
#   distribution_class    one of: download_only, repository_embedded,
#                         generated_derived_output, documentation_reference
#   distributed           whether NSB currently ships these bytes on any channel
#   channels              non-empty when distributed = true, e.g. git_repository
#   planned_channels      frozen intended channels; not proof of publication
#   lifecycle             candidate, staged, production_registered or published
#   tracking_issue        optional GitHub issue that owns an open gap
#   notes                 free-text redistribution-relevant commentary

schema_version = 1

