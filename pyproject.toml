[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "nsb-rust"
dynamic = ["version", "description", "readme", "authors", "license", "keywords", "urls"]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["siderust>=0.4.0,<0.5", "tempoch>=0.4.0,<0.5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.maturin]
manifest-path = "crates/nsb/Cargo.toml"
module-name = "nsb"
bindings = "pyo3"
features = ["python"]
# Release wheels use --locked in CI. Cargo must prune the workspace lockfile
# when maturin builds the library-only sdist; retained dependency pins are reused.

# Notices accompany binary wheels as well as the Rust source distribution.
include = [
    { path = "crates/nsb/THIRD_PARTY_NOTICES.md", format = ["sdist", "wheel"] },
]
