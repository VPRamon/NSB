[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "nsb-py"
# Inherit the authoritative release version and metadata from crates/nsb/Cargo.toml.
dynamic = ["version", "description", "authors", "license", "keywords", "urls"]
readme = "README_PYPI.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["siderust>=0.6.0,<0.7", "tempoch>=0.5.0,<0.6"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.maturin]
manifest-path = "crates/nsb/Cargo.toml"
module-name = "nsb"
bindings = "pyo3"
features = ["python"]
# Release wheels use --locked in CI. Cargo must prune the workspace lockfile
# when maturin builds the library-only sdist; retained dependency pins are reused.

# PEP 639 requires the root LICENSE declared in PKG-INFO to be inside the sdist.
# Maturin does not automatically pull it in from outside crates/nsb.
# Scientific-data notices accompany source and binary distributions.
include = [
    { path = "LICENSE", format = "sdist" },
    { path = "README_PYPI.md", format = "sdist" },
    { path = "crates/nsb/THIRD_PARTY_NOTICES.md", format = ["sdist", "wheel"] },
    { path = "crates/nsb/AIRGLOW_DATA_NOTICES.md", format = ["sdist", "wheel"] },
]
