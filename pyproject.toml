[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "nsb"
version = "0.1.0"
description = "Night Sky Background — Rust port of CTAO darknsb (Python bindings)."
license = { text = "BSD-3-Clause" }
authors = [{ name = "VPRamon", email = "vallespuigramon@gmail.com" }]
requires-python = ">=3.9"

[tool.maturin]
features = ["python"]
module-name = "nsb._native"
python-source = "python"
