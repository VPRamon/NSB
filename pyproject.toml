[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "nsb-rust"
dynamic = ["version", "description", "readme", "authors", "license", "keywords", "urls"]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["siderust>=0.2.1,<0.3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.maturin]
manifest-path = "crates/nsb/Cargo.toml"
module-name = "nsb"
bindings = "pyo3"
features = ["python"]
locked = true
