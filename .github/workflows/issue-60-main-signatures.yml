name: Issue 60 inspect command entrypoints

on:
  push:
    branches: [agent/resolve-issue-60]

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/resolve-issue-60
          fetch-depth: 0
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('crates/nsb-data-tools/src/bin')
          names = [
              'build_starlight_map', 'prepare_tycho_starlight_catalogue',
              'prepare_gaia_starlight_catalogue', 'validate_starlight_map',
              'pack_starlight_asset', 'verify_assets', 'sweep_starlight_nside',
              'generate_gaia_starlight_release_inputs', 'query_gaia_tap',
              'build_integrated_starlight_product', 'generate_starlight_sample_queries',
              'consolidate_gaia_starlight_samples', 'normalize_xp_continuous_coefficients',
              'validate_xp_continuous_reconstruction', 'train_starlight_photometry_models',
              'index_gaia_xp_continuous_bulk', 'audit_gaia_starlight_exclusions',
          ]
          report = []
          for name in names:
              source = (root / f'{name}.rs').read_text()
              lines = source.splitlines()
              found = False
              for index, line in enumerate(lines):
                  if re.search(r'\bfn\s+main\s*\(', line):
                      start = max(0, index - 2)
                      end = min(len(lines), index + 4)
                      report.append(f'## {name}\n' + '\n'.join(lines[start:end]))
                      found = True
              if not found:
                  report.append(f'## {name}\nNO MAIN FOUND')
          output = Path('.github/diagnostics/main-signatures.txt')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text('\n\n'.join(report) + '\n')
          PY
          rm .github/workflows/issue-60-main-signatures.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ci: capture retained command entrypoint signatures"
          git push origin HEAD:agent/resolve-issue-60
