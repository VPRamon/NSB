name: Temporary ORM all-sky validation

on:
  push:
    branches: [example/orm-all-sky-nsb]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Prepare validation logs
        run: mkdir -p /tmp/orm-validation
      - name: Resolve lockfile and format
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 2>&1 | tee /tmp/orm-validation/metadata.log >/dev/null
          cargo fmt --all 2>&1 | tee /tmp/orm-validation/fmt-write.log
      - name: Persist lockfile/formatting updates
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- Cargo.lock crates/nsb/Cargo.toml crates/nsb/examples/all_sky_orm.rs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock crates/nsb/Cargo.toml crates/nsb/examples/all_sky_orm.rs
            git commit -m "Update lockfile and format all-sky example"
            git push
          fi
      - name: Format check
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check 2>&1 | tee /tmp/orm-validation/fmt-check.log
      - name: Clippy example gate
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p nsb --examples -- -D warnings 2>&1 | tee /tmp/orm-validation/clippy.log
      - name: NSB tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p nsb --locked 2>&1 | tee /tmp/orm-validation/test.log
      - name: Run representative all-sky map
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -f 'WALL_SECONDS=%e' cargo run --release --locked -p nsb --example all_sky_orm -- \
            --time 2026-09-17T23:00:00Z \
            --output /tmp/orm_nsb.png \
            --step-deg 2 2>&1 | tee /tmp/orm-validation/all_sky_run.log
          python3 - <<'PY' | tee /tmp/orm-validation/png.log
          import struct
          p = '/tmp/orm_nsb.png'
          with open(p, 'rb') as f:
              sig = f.read(8)
              if sig != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit('not a PNG')
              length = struct.unpack('>I', f.read(4))[0]
              kind = f.read(4)
              if kind != b'IHDR' or length != 13:
                  raise SystemExit('missing PNG IHDR')
              width, height = struct.unpack('>II', f.read(8))
          print(f'PNG_DIMENSIONS={width}x{height}')
          PY
          echo "PNG_BYTES=$(stat -c %s /tmp/orm_nsb.png)" | tee -a /tmp/orm-validation/png.log
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orm-validation-logs
          path: /tmp/orm-validation
          if-no-files-found: warn
      - name: Upload generated PNG
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orm-nsb-step-2
          path: /tmp/orm_nsb.png
          if-no-files-found: error
