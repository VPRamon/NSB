name: Issue 59 deduplication codemod

on:
  push:
    branches:
      - agent/resolve-issue-59
    paths:
      - tools/issue59_codemod.py
      - tools/issue59_fixup.py
      - .github/workflows/issue59-codemod.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: read

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/resolve-issue-59
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt

      - name: Apply deterministic transformation
        run: |
          python3 tools/issue59_codemod.py
          python3 tools/issue59_fixup.py

      - name: Format workspace
        run: cargo fmt --all

      - name: Compile library and integration tests
        id: compile
        shell: bash
        run: |
          set +e
          cargo test --locked -p nsb-data-tools --lib --tests --no-run > /tmp/issue59-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 400 /tmp/issue59-build.log > issue59_build_failure.log
            git diff --binary > issue59_generated.patch
            cat issue59_build_failure.log
            exit "$status"
          fi
          tail -n 40 /tmp/issue59-build.log

      - name: Upload failed patch and compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue59-build-diagnostics
          path: |
            issue59_build_failure.log
            issue59_generated.patch
          if-no-files-found: error
          retention-days: 3

      - name: Remove one-shot automation
        if: success()
        run: git rm tools/issue59_codemod.py tools/issue59_fixup.py .github/workflows/issue59-codemod.yml

      - name: Commit generated patch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: establish authoritative data-product contracts"
          git push origin HEAD:agent/resolve-issue-59
