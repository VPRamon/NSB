name: Issue 59 deduplication codemod

on:
  push:
    branches:
      - agent/resolve-issue-59
    paths:
      - tools/issue59_codemod.py
      - .github/workflows/issue59-codemod.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: read

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/resolve-issue-59
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt

      - name: Apply deterministic transformation
        run: python3 tools/issue59_codemod.py

      - name: Format workspace
        run: cargo fmt --all

      - name: Compile library and integration tests
        run: cargo test --locked -p nsb-data-tools --lib --tests --no-run

      - name: Remove one-shot automation
        run: git rm tools/issue59_codemod.py .github/workflows/issue59-codemod.yml

      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: establish authoritative data-product contracts"
          git push origin HEAD:agent/resolve-issue-59
