name: Issue 60 one-shot validation

on:
  push:
    branches: [agent/resolve-issue-60]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  format-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/resolve-issue-60
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all
      - name: Compile library and integration tests
        id: check
        shell: bash
        run: |
          set +e
          cargo check --locked -p nsb-data-tools --lib --tests > issue60-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Lint data tools
        id: clippy
        shell: bash
        run: |
          set +e
          cargo clippy --locked -p nsb-data-tools --lib --tests -- -D warnings > issue60-clippy.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish formatted result and diagnostics
        if: always()
        shell: bash
        run: |
          check_status='${{ steps.check.outputs.status }}'
          clippy_status='${{ steps.clippy.outputs.status }}'
          if [[ "$check_status" == 0 && "$clippy_status" == 0 ]]; then
            rm -f issue60-check.log issue60-clippy.log
            rm .github/workflows/issue-60-one-shot.yml
          else
            mkdir -p .github/diagnostics
            mv issue60-check.log .github/diagnostics/issue60-check.log
            mv issue60-clippy.log .github/diagnostics/issue60-clippy.log
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style: format pipeline contracts and capture diagnostics"
            git push origin HEAD:agent/resolve-issue-60
          fi
          if [[ "$check_status" != 0 || "$clippy_status" != 0 ]]; then
            exit 1
          fi
