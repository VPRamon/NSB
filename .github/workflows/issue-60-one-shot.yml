name: Issue 60 one-shot validation

on:
  push:
    branches: [agent/resolve-issue-60]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  format-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/resolve-issue-60
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all
      - name: Compile library and integration tests
        run: cargo check --locked -p nsb-data-tools --lib --tests
      - name: Lint data tools
        run: cargo clippy --locked -p nsb-data-tools --lib --tests -- -D warnings
      - name: Remove one-shot workflow and publish result
        shell: bash
        run: |
          rm .github/workflows/issue-60-one-shot.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format and validate pipeline contracts"
          git push origin HEAD:agent/resolve-issue-60
