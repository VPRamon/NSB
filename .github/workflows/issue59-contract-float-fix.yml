name: Fix issue 59 scientific contract comparison

on:
  push:
    branches:
      - agent/resolve-issue-59
    paths:
      - .github/workflows/issue59-contract-float-fix.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: read

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/resolve-issue-59
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt

      - name: Apply semantic float comparison
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          scientific = Path("crates/nsb-data-tools/src/scientific_contract.rs")
          text = scientific.read_text(encoding="utf-8")

