name: Scientific validation

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without Git LFS payloads
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Fetch production Starlight payload
        shell: bash
        run: |
          git lfs install --local
          git lfs pull --include="crates/nsb/data/starlight_nside512.csv" --exclude=""
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Verify complete scientific asset payloads
        run: cargo test --locked -p nsb-data-tools --test scientific_assets repository_scientific_asset_payloads_verify -- --ignored --exact
      - name: Run external and end-to-end validation matrices
        run: |
          cargo test --locked -p nsb full_moon_reference_geometry_matches_published_brightness
          cargo test --locked -p nsb components::starlight::validated
          cargo test --locked -p nsb-data-tools --lib starlight::map::build_starlight_map::tests
          cargo test --locked -p nsb-cli --test cli_smoke validated_external_starlight_is_production_labelled_in_json
          cargo test --locked -p nsb --test end_to_end_validation
          cargo test --locked -p nsb --test jones2013_validation
          cargo test --locked -p nsb --test science_metadata
