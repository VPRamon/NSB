name: Zodiacal exact validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  exact:
    name: Exact requested validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without Git LFS payloads
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: zodiacal-exact-validation
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check all targets and features
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Clippy all targets and features
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test all workspace targets
        run: cargo test --workspace --all-targets --locked
      - name: Build documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps
      - name: Focused Zodiacal model-selection tests
        run: cargo test --locked -p nsb --test zodiacal_model_selection
      - name: Focused CLI contract tests
        run: cargo test --locked -p nsb-cli --test point_contract --test window_contract
      - name: Pre-freeze public API guard tests
        run: cargo test --locked -p nsb-public-api-gate --test pre_freeze
