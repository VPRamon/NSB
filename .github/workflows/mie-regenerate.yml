name: Regenerate moonlight Mie artifact

on:
  pull_request:
    paths:
      - crates/nsb-data-tools/src/dataset/engine_core.rs
      - crates/nsb-data-tools/src/dataset/moonlight_mie.rs
      - crates/nsb-data-tools/src/dataset/pipeline.rs
      - crates/nsb-data-tools/config/moonlight-aerosol-nsb-v1.toml
      - crates/nsb-data-tools/config/moonlight-scattering.toml
      - crates/nsb/data/moonlight_mie_nsb_v1.dat
      - crates/nsb/data/manifest.toml
      - Cargo.lock
      - .github/workflows/mie-regenerate.yml
  push:
    branches:
      - main
    paths:
      - crates/nsb-data-tools/src/dataset/engine_core.rs
      - crates/nsb-data-tools/src/dataset/moonlight_mie.rs
      - crates/nsb-data-tools/src/dataset/pipeline.rs
      - crates/nsb-data-tools/config/moonlight-aerosol-nsb-v1.toml
      - crates/nsb-data-tools/config/moonlight-scattering.toml
      - crates/nsb/data/moonlight_mie_nsb_v1.dat
      - crates/nsb/data/manifest.toml
      - Cargo.lock
      - .github/workflows/mie-regenerate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate, validate, and publish in the workspace
        run: |
          set -euo pipefail
          cargo run --release --locked -p nsb-data-tools --bin nsb-data -- \
            dataset moonlight-scattering update \
            --config crates/nsb-data-tools/config/moonlight-scattering.toml
          cargo run --release --locked -p nsb-data-tools --bin nsb-data -- \
            dataset moonlight-scattering build \
            --config crates/nsb-data-tools/config/moonlight-scattering.toml
          cargo run --release --locked -p nsb-data-tools --bin nsb-data -- \
            dataset moonlight-scattering validate \
            --config crates/nsb-data-tools/config/moonlight-scattering.toml
          cargo run --release --locked -p nsb-data-tools --bin nsb-data -- \
            dataset moonlight-scattering publish \
            --config crates/nsb-data-tools/config/moonlight-scattering.toml
          git diff --exit-code -- \
            crates/nsb/data/moonlight_mie_nsb_v1.dat \
            crates/nsb/data/manifest.toml
