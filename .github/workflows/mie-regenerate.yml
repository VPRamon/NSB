name: Check moonlight scattering reproducibility

on:
  pull_request:
    paths:
      - crates/nsb-data-tools/src/dataset/**
      - crates/nsb-data-tools/Cargo.toml
      - Cargo.toml
      - Cargo.lock
      - crates/nsb-data-tools/config/moonlight-aerosol-nsb-v1.toml
      - crates/nsb-data-tools/config/moonlight-multiscatter-nsb-v1.toml
      - crates/nsb-data-tools/config/moonlight-scattering.toml
      - crates/nsb/src/components/moonlight/**
      - crates/nsb/data/moonlight_mie_nsb_v1.dat
      - crates/nsb/data/moonlight_multiscatter_nsb_v1.dat
      - crates/nsb/data/manifest.toml
      - docs/nsb_components/moonlight/mie-phase-validation.md
      - docs/nsb_components/moonlight/multiple-scattering-validation.md
      - docs/nsb_components/moonlight/production-runs/multiscatter-nsb-v1.toml
      - .github/workflows/mie-regenerate.yml
  push:
    branches:
      - main
    paths:
      - crates/nsb-data-tools/src/dataset/**
      - crates/nsb-data-tools/Cargo.toml
      - Cargo.toml
      - Cargo.lock
      - crates/nsb-data-tools/config/moonlight-aerosol-nsb-v1.toml
      - crates/nsb-data-tools/config/moonlight-multiscatter-nsb-v1.toml
      - crates/nsb-data-tools/config/moonlight-scattering.toml
      - crates/nsb/src/components/moonlight/**
      - crates/nsb/data/moonlight_mie_nsb_v1.dat
      - crates/nsb/data/moonlight_multiscatter_nsb_v1.dat
      - crates/nsb/data/manifest.toml
      - docs/nsb_components/moonlight/mie-phase-validation.md
      - docs/nsb_components/moonlight/multiple-scattering-validation.md
      - docs/nsb_components/moonlight/production-runs/multiscatter-nsb-v1.toml
      - .github/workflows/mie-regenerate.yml

permissions:
  contents: read

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate and validate moonlight scattering
        run: |
          set -euo pipefail
          cargo run --release --locked -p nsb-data-tools --bin nsb-data -- dataset moonlight-scattering update --config crates/nsb-data-tools/config/moonlight-scattering.toml
          cargo run --release --locked -p nsb-data-tools --bin nsb-data -- dataset moonlight-scattering build --config crates/nsb-data-tools/config/moonlight-scattering.toml
          cargo run --release --locked -p nsb-data-tools --bin nsb-data -- dataset moonlight-scattering validate --config crates/nsb-data-tools/config/moonlight-scattering.toml
          cargo run --release --locked -p nsb-data-tools --bin nsb-data -- dataset moonlight-scattering publish --config crates/nsb-data-tools/config/moonlight-scattering.toml
      - name: Verify deterministic generated outputs
        run: |
          git diff --exit-code -- \
            crates/nsb/data/moonlight_mie_nsb_v1.dat \
            crates/nsb/data/moonlight_multiscatter_nsb_v1.dat \
            crates/nsb/data/manifest.toml
