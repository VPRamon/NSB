name: Observational notebook

on:
  pull_request:
    paths:
      - 'examples/validation/**'
      - '.github/workflows/observational-notebook.yml'
  push:
    branches: [main]
    paths:
      - 'examples/validation/**'
      - '.github/workflows/observational-notebook.yml'
  workflow_dispatch:
    inputs:
      nsb_commit:
        description: 'Full clean public NSB source commit for a development experiment'
        required: true
        default: 'f5e1d22689ed417c0dcf9df72da54365c30f5bd5'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: >-
          python -m pip install numpy==2.5.4 astropy==8.0.2 matplotlib==3.11.2
          nbformat==5.11.1 nbclient==0.11.0 ipykernel==7.4.0 pytest ruff
      - run: python -m pytest examples/validation/tests -q
      - run: ruff check --isolated --select E4,E7,E9,F,I,B --line-length 100 examples/validation
      - run: ruff format --isolated --line-length 100 --check examples/validation

  patat:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install maturin==1.15.0 nbformat==5.11.1 nbclient==0.11.0 ipykernel==7.4.0
      - name: Explicit source preparation (outside scientific analysis)
        env:
          SELECTED_COMMIT: ${{ inputs.nsb_commit }}
        run: |
          [[ "$SELECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git clone https://github.com/VPRamon/NSB.git "$RUNNER_TEMP/nsb-source"
          git -C "$RUNNER_TEMP/nsb-source" checkout --detach "$SELECTED_COMMIT"
          test -z "$(git -C "$RUNNER_TEMP/nsb-source" status --porcelain)"
          cd "$RUNNER_TEMP/nsb-source"
          python -m maturin build --release --locked --interpreter "$(which python)" --out "$RUNNER_TEMP/nsb-wheels"
          test -z "$(git status --porcelain)"
          python -m pip install "$RUNNER_TEMP"/nsb-wheels/*.whl
      - name: Execute a single-file observational notebook copy
        env:
          NSB_VALIDATION_MODE: observational
          NSB_VALIDATION_RUNTIME: developer
          NSB_VALIDATION_COMMIT: ${{ inputs.nsb_commit }}
          NSB_VALIDATION_CACHE: ${{ runner.temp }}/observations
          NSB_VALIDATION_OUTPUT: ${{ runner.temp }}/validation-results
        run: |
          python - <<'PY'
          import hashlib, os, shutil
          from importlib.metadata import version
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient
          root = Path(os.environ['RUNNER_TEMP'])
          (root / 'validation-results').mkdir(exist_ok=True)
          wheel, = (root / 'nsb-wheels').glob('*.whl')
          os.environ['NSB_VALIDATION_WHEEL'] = str(wheel)
          os.environ['NSB_VALIDATION_WHEEL_SHA256'] = hashlib.sha256(wheel.read_bytes()).hexdigest()
          os.environ['NSB_VALIDATION_VERSION'] = version('nsb-py')
          work = root / 'single-notebook'
          work.mkdir()
          notebook = work / 'NSB_Validation.ipynb'
          shutil.copyfile('examples/validation/NSB_Validation.ipynb', notebook)
          nb = nbformat.read(notebook, as_version=4)
          try:
              NotebookClient(nb, timeout=1800, kernel_name='python3', resources={'metadata': {'path': str(work)}}).execute()
          finally:
              nbformat.write(nb, root / 'validation-results' / 'executed.ipynb')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patat-development-results
          path: |
            ${{ runner.temp }}/validation-results
            ${{ runner.temp }}/nsb-wheels
            ${{ runner.temp }}/nsb-source/Cargo.lock
          if-no-files-found: warn
