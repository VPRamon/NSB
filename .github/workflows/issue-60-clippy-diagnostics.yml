name: Issue 60 Clippy diagnostics

# Self-removing diagnostic run.
on:
  push:
    branches: [agent/resolve-issue-60]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/resolve-issue-60
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - shell: bash
        run: |
          set +e
          mkdir -p .github/diagnostics
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings > .github/diagnostics/issue60-clippy.log 2>&1
          echo "clippy_status=$?" > .github/diagnostics/issue60-clippy-status.log
          rm .github/workflows/issue-60-clippy-diagnostics.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ci: capture focused issue 60 Clippy diagnostics"
          git push origin HEAD:agent/resolve-issue-60
