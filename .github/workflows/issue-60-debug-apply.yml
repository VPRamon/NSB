name: Issue 60 debug thin adapter transform

on:
  push:
    branches: [agent/resolve-issue-60]

permissions:
  contents: write

jobs:
  debug:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/resolve-issue-60
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - shell: bash
        run: |
          set +e
          mkdir -p .github/diagnostics
          {
            echo 'extracting transform script'
            awk '
              /python3 - <<.PY./ { capture=1; next }
              capture && /^          PY$/ { capture=0; exit }
              capture { sub(/^          /, ""); print }
            ' .github/workflows/issue-60-apply-thin.yml > /tmp/issue60-transform.py
            python3 /tmp/issue60-transform.py
            transform_status=$?
            echo "transform_status=$transform_status"
            if [[ $transform_status == 0 ]]; then
              cargo fmt --all
              echo "rustfmt_status=$?"
            fi
          } > .github/diagnostics/thin-transform.log 2>&1
          rm .github/workflows/issue-60-debug-apply.yml
          git restore . ':!.github/diagnostics/thin-transform.log' ':!.github/workflows/issue-60-debug-apply.yml'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ci: capture thin-adapter transform diagnostics"
          git push origin HEAD:agent/resolve-issue-60
