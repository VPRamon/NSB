name: Capture PR 69 Clippy

on:
  push:
    branches: [merge-tools-20260726]

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: merge-tools-20260726
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings > clippy-pr69.log 2>&1
          status=$?
          printf '\nexit_status=%s\n' "$status" >> clippy-pr69.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add clippy-pr69.log
          git commit -m "Capture PR 69 Clippy diagnostics"
          git push origin HEAD:merge-tools-20260726
