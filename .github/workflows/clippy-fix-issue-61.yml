name: Clippy fix issue 61

on:
  pull_request:
    branches: [main]
    paths:
      - crates/nsb-data-tools/**/*.rs
      - .github/workflows/clippy-fix-issue-61.yml

permissions:
  contents: write

jobs:
  clippy-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Install Rust and Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply machine-applicable Clippy fixes
        shell: bash
        run: |
          set +e
          cargo clippy --fix --workspace --all-targets --all-features --locked --allow-dirty --allow-staged -- -D warnings
          status=$?
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.rs'
            git commit -m "style: apply Clippy fixes to issue 61 migration"
            git push origin HEAD:${{ github.head_ref }}
          fi
          exit "$status"
