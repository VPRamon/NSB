name: Clippy diagnostic issue 61

on:
  pull_request:
    branches: [main]
    paths:
      - crates/nsb-data-tools/**/*.rs
      - .github/workflows/clippy-fix-issue-61.yml

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings

jobs:
  clippy-diagnostic:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Install Rust and Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Capture exact CI diagnostic
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings > clippy-issue-61.log 2>&1
          status=$?
          printf '\nexit_status=%s\n' "$status" >> clippy-issue-61.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clippy-issue-61.log
          git commit -m "ci: capture Clippy diagnostic for issue 61"
          git push origin HEAD:${{ github.head_ref }}
