name: Validate native GUI

on:
  push:
    branches:
      - feat/issue-223-native-gui

permissions:
  contents: write

jobs:
  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all
      - name: Check GUI
        run: cargo check -p nsb-gui --all-targets --locked
      - name: Clippy GUI
        run: cargo clippy -p nsb-gui --all-targets --locked -- -D warnings
      - name: Test GUI
        run: cargo test -p nsb-gui --locked
      - name: Check GUI on MSRV
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 check -p nsb-gui --all-targets --locked
      - name: Commit rustfmt changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Formatting already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/nsb-gui
          git commit -m "style(gui): apply rustfmt"
          git push
