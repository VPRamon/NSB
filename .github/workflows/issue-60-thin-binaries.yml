name: Issue 60 thin data-tool binaries

on:
  push:
    branches: [agent/resolve-issue-60]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/resolve-issue-60
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Move retained command implementations behind library services
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('crates/nsb-data-tools')
          names = [
              'build_starlight_map',
              'prepare_tycho_starlight_catalogue',
              'prepare_gaia_starlight_catalogue',
              'validate_starlight_map',
              'pack_starlight_asset',
              'verify_assets',
              'sweep_starlight_nside',
              'generate_gaia_starlight_release_inputs',
              'query_gaia_tap',
              'build_integrated_starlight_product',
              'generate_starlight_sample_queries',
              'consolidate_gaia_starlight_samples',
              'normalize_xp_continuous_coefficients',
              'validate_xp_continuous_reconstruction',
              'train_starlight_photometry_models',
              'index_gaia_xp_continuous_bulk',
              'audit_gaia_starlight_exclusions',
          ]
          services = root / 'src' / 'tool_services'
          services.mkdir(parents=True, exist_ok=True)
          main_pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)(?P<async>async\s+)?fn\s+main\s*\(\s*\)'
              r'(?P<ret>\s*->\s*[^\{\n]+)?\s*\{'
          )

          for name in names:
              source_path = root / 'src' / 'bin' / f'{name}.rs'
              source = source_path.read_text()
              matches = list(main_pattern.finditer(source))
              if len(matches) != 1:
                  raise SystemExit(f'{source_path}: expected one zero-argument main, found {len(matches)}')
              match = matches[0]
              ret = (match.group('ret') or '').strip()
              if 'Result' not in ret:
                  raise SystemExit(f'{source_path}: unsupported main return type {ret!r}')
              async_token = match.group('async') or ''
              replacement = (
                  f'{match.group("indent")}/// Run the `{name}` command using process arguments.\n'
                  f'{match.group("indent")}pub {async_token}fn run_cli() {ret} {{'
              )
              source = source[:match.start()] + replacement + source[match.end():]
              source = source.replace('eprintln!();', 'log::info!("");')
              source = source.replace('eprintln!', 'log::info!')
              (services / f'{name}.rs').write_text(source)
              source_path.write_text(f'''//! Thin executable adapter for `{name}`.\n\nfn main() -> anyhow::Result<()> {{\n    nsb_data_tools::tool_logging::init_from_env()\n        .map_err(|error| anyhow::anyhow!("failed to initialize logging: {{error}}"))?;\n    log::info!(target: "nsb_data_tools::{name}", "starting command");\n    let result = nsb_data_tools::tool_services::{name}::run_cli();\n    if let Err(error) = &result {{\n        log::error!(target: "nsb_data_tools::{name}", "command failed: {{error:#}}");\n    }}\n    result\n}}\n''')

          mod_lines = [
              '//! Retained data-product command implementations exposed as library services.',
              '',
          ]
          mod_lines.extend(f'pub mod {name};' for name in names)
          mod_lines.append('')
          (services / 'mod.rs').write_text('\n'.join(mod_lines))

          logging = root / 'src' / 'tool_logging.rs'
          logging.write_text(r'''//! Stderr logger for data-product executable adapters.
//!
//! Reusable services emit through the `log` facade. Executable adapters call
//! [`init_from_env`] once, preserving stdout for stable machine-readable data.

use log::{LevelFilter, Log, Metadata, Record, SetLoggerError};
use std::env;

static LOGGER: StderrLogger = StderrLogger;

/// Initialize the process logger from `NSB_LOG` or `RUST_LOG`.
///
/// The default level is `warn`, matching the public NSB logging contract.
pub fn init_from_env() -> Result<LevelFilter, SetLoggerError> {
    let level = env_level().unwrap_or(LevelFilter::Warn);
    log::set_logger(&LOGGER)?;
    log::set_max_level(level);
    Ok(level)
}

fn env_level() -> Option<LevelFilter> {
    env::var("NSB_LOG")
        .ok()
        .and_then(|value| parse_level_filter(&value))
        .or_else(|| {
            env::var("RUST_LOG")
                .ok()
                .and_then(|value| parse_level_filter(&value))
        })
}

fn parse_level_filter(value: &str) -> Option<LevelFilter> {
    let mut global = None;
    let mut data_tools = None;
    for directive in value.split(',').map(str::trim).filter(|value| !value.is_empty()) {
        if let Some((target, level)) = directive.rsplit_once('=') {
            let target = target.trim().replace('-', "_");
            if matches!(target.as_str(), "nsb" | "nsb_data_tools")
                || target.starts_with("nsb::")
                || target.starts_with("nsb_data_tools::")
            {
                data_tools = parse_level(level);
            }
        } else {
            global = parse_level(directive);
        }
    }
    data_tools.or(global)
}

fn parse_level(value: &str) -> Option<LevelFilter> {
    match value.trim().to_ascii_lowercase().as_str() {
        "off" => Some(LevelFilter::Off),
        "error" => Some(LevelFilter::Error),
        "warn" | "warning" => Some(LevelFilter::Warn),
        "info" => Some(LevelFilter::Info),
        "debug" => Some(LevelFilter::Debug),
        "trace" => Some(LevelFilter::Trace),
        _ => None,
    }
}

struct StderrLogger;

impl Log for StderrLogger {
    fn enabled(&self, metadata: &Metadata<'_>) -> bool {
        metadata.level() <= log::max_level()
    }

    fn log(&self, record: &Record<'_>) {
        if self.enabled(record.metadata()) {
            eprintln!(
                "[{level} {target}] {message}",
                level = record.level(),
                target = record.target(),
                message = record.args()
            );
        }
    }

    fn flush(&self) {}
}

#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn parses_plain_and_targeted_levels() {
        assert_eq!(parse_level_filter("debug"), Some(LevelFilter::Debug));
        assert_eq!(
            parse_level_filter("warn,nsb-data-tools=trace"),
            Some(LevelFilter::Trace)
        );
        assert_eq!(
            parse_level_filter("info,other=trace,nsb_data_tools::pipeline=debug"),
            Some(LevelFilter::Debug)
        );
    }
}
''')

          lib = root / 'src' / 'lib.rs'
          text = lib.read_text()
          if '#![forbid(unsafe_code)]' not in text:
              text = text.replace(
                  '//! Shared implementation for NSB maintainer data-product tools.\n',
                  '//! Shared implementation for NSB maintainer data-product tools.\n\n'
                  '#![forbid(unsafe_code)]\n#![warn(missing_docs)]\n\n'
                  'extern crate self as nsb_data_tools;\n',
                  1,
              )
          if 'pub mod tool_logging;' not in text:
              text += '\npub mod tool_logging;\npub mod tool_services;\n'
          lib.write_text(text)

          cargo = root / 'Cargo.toml'
          text = cargo.read_text()
          if '\nlog = "0.4"\n' not in text:
              text = text.replace('\nhttpdate = "1"\n', '\nhttpdate = "1"\nlog = "0.4"\n')
          cargo.write_text(text)
          PY
      - name: Format
        run: cargo fmt --all
      - name: Compile all data-tool targets
        id: check
        shell: bash
        run: |
          set +e
          cargo check --locked -p nsb-data-tools --all-targets > issue60-thin-check.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Lint all data-tool targets
        id: clippy
        shell: bash
        run: |
          set +e
          cargo clippy --locked -p nsb-data-tools --all-targets -- -D warnings > issue60-thin-clippy.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit transformation or diagnostics
        if: always()
        shell: bash
        run: |
          check_status='${{ steps.check.outputs.status }}'
          clippy_status='${{ steps.clippy.outputs.status }}'
          if [[ "$check_status" == 0 && "$clippy_status" == 0 ]]; then
            rm -f issue60-thin-check.log issue60-thin-clippy.log
            rm .github/workflows/issue-60-thin-binaries.yml
          else
            mkdir -p .github/diagnostics
            mv issue60-thin-check.log .github/diagnostics/issue60-thin-check.log
            mv issue60-thin-clippy.log .github/diagnostics/issue60-thin-clippy.log
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: move retained commands behind library services"
          git push origin HEAD:agent/resolve-issue-60
          if [[ "$check_status" != 0 || "$clippy_status" != 0 ]]; then
            exit 1
          fi
