name: Format snapshot

on:
  pull_request:
    paths:
      - "crates/nsb-data-tools/tests/tool_registry.rs"
      - ".github/workflows/format-snapshot.yml"

permissions:
  contents: read

jobs:
  format-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-tool-registry
          path: crates/nsb-data-tools/tests/tool_registry.rs
          if-no-files-found: error
