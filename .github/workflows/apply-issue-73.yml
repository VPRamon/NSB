name: Apply issue 73 implementation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/validate-complete-starlight-merges' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/validate-complete-starlight-merges
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply implementation
        env:
          PAYLOAD_B64: 
        run: |
          mkdir -p /tmp/issue73
          printf '%s' "$PAYLOAD_B64" | base64 -d > /tmp/issue73/payload.tar.gz
          tar -xzf /tmp/issue73/payload.tar.gz -C /tmp/issue73
          ISSUE73_PATCH_ROOT=/tmp/issue73 python /tmp/issue73/apply73.py
      - name: Format
        run: cargo fmt --all
      - name: Test Starlight map implementation
        run: cargo test -p nsb-data-tools starlight::map --locked
      - name: Test data tools
        run: cargo test -p nsb-data-tools --locked
      - name: Lint data tools
        run: cargo clippy -p nsb-data-tools --all-targets --locked -- -D warnings
      - name: Commit implementation
        run: |
          rm .github/workflows/apply-issue-73.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/nsb-data-tools/src/starlight/map/accumulator.rs
          git add crates/nsb-data-tools/src/starlight/map/product.rs
          git add crates/nsb-data-tools/src/dataset/engine_core.rs
          git add docs/nsb_components/starlight/map-validation.md
          git add docs/nsb_components/starlight/existing-datasets.md
          git add CHANGELOG.md
          git add .github/workflows/apply-issue-73.yml
          git commit -m "Validate complete deterministic Starlight merges"
          git push origin HEAD:agent/validate-complete-starlight-merges
