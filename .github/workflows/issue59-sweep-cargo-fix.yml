name: Apply issue 59 sweep orchestration fix

on:
  pull_request:
    branches:
      - agent/resolve-issue-59
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/issue59-sweep-fix-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/resolve-issue-59
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Replace cargo-mediated sibling orchestration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("crates/nsb-data-tools/src/bin/sweep_starlight_nside.rs")
          text = path.read_text()

          build_call = "        build_release_tools()?;\n"
          if text.count(build_call) != 1:
              raise SystemExit("expected exactly one build_release_tools call")
          text = text.replace(build_call, "")

          pattern = re.compile(
              r"fn cargo_tool\(bin: &str, args: Vec<String>\) -> Result<\(\)> \{.*?\n\}\n\n"
              r"fn build_release_tools\(\) -> Result<\(\)> \{.*?\n\}\n\n"
              r"(?=fn path_str)",
              re.DOTALL,
          )
          replacement = '''fn run_sibling_tool(bin: &str, args: Vec<String>) -> Result<()> {
              let executable = sibling_tool_path(bin)?;
              let status = Command::new(&executable)
                  .args(args)
                  .status()
                  .with_context(|| format!("failed to run sibling tool {}", executable.display()))?;
              if !status.success() {
                  bail!("sweep subcommand {bin} failed with status {status}");
              }
              Ok(())
          }

          fn sibling_tool_path(bin: &str) -> Result<PathBuf> {
              let current =
                  std::env::current_exe().context("failed to resolve sweep executable path")?;
              let directory = current
                  .parent()
                  .context("sweep executable path has no parent directory")?;
              let file_name = if cfg!(windows) {
                  format!("{bin}.exe")
              } else {
                  bin.to_string()
              };
              let executable = directory.join(file_name);
              if !executable.is_file() {
                  bail!(
                      "required sibling tool {} is missing; install or build all nsb-data-tools binaries together",
                      executable.display()
                  );
              }
              Ok(executable)
          }

          '''
          text, replacements = pattern.subn(replacement, text)
          if replacements != 1:
              raise SystemExit(f"expected one orchestration helper block, replaced {replacements}")

          call_count = text.count("cargo_tool(")
          if call_count != 3:
              raise SystemExit(f"expected three cargo_tool calls, found {call_count}")
          text = text.replace("cargo_tool(", "run_sibling_tool(")

          if 'Command::new("cargo")' in text or "build_release_tools" in text:
              raise SystemExit("cargo-mediated orchestration remains")
          if text.count("run_sibling_tool(") != 4:
              raise SystemExit("unexpected sibling-tool call count")

          path.write_text(text)
          PY

          cargo fmt --all
          cargo test --locked -p nsb-data-tools --test deduplication_contract
          cargo check --locked -p nsb-data-tools --bin sweep_starlight_nside

      - name: Commit focused fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/issue59-sweep-cargo-fix.yml
          git config user.name "VPRamon"
          git config user.email "74069811+VPRamon@users.noreply.github.com"
          git add crates/nsb-data-tools/src/bin/sweep_starlight_nside.rs .github/workflows/issue59-sweep-cargo-fix.yml
          git commit -m "fix: remove cargo-mediated sweep orchestration"
          git push origin HEAD:agent/resolve-issue-59
