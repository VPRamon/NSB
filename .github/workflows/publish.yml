name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      recovery_mode:
        description: "Recovery operation: missing PyPI sdist or GitHub Release only"
        required: true
        default: pypi-sdist
        type: choice
        options: [pypi-sdist, github-release]
      recovery_tag:
        description: "Existing release tag (for example v0.1.0)"
        required: true
        type: string
      wheels_run_id:
        description: "Original release run that successfully published the five wheels"
        required: true
        type: string
      sdist_run_id:
        description: "Later release run containing the validated, repaired sdist"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.recovery_tag || github.ref_name }}
  cancel-in-progress: false

env:
  MATURIN_VERSION: v1.15.0

jobs:
  validate:
    name: Validate release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Reject tag-push release when PyPI already contains this version
        shell: python
        run: |
          import json
          import os
          from urllib.error import HTTPError
          from urllib.request import urlopen

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          endpoint = f"https://pypi.org/pypi/nsb-py/{version}/json"
          try:
              with urlopen(endpoint, timeout=30) as response:
                  uploads = json.load(response)["urls"]
          except HTTPError as error:
              if error.code != 404:
                  raise
              uploads = []

          if uploads:
              filenames = ", ".join(sorted(item["filename"] for item in uploads))
              raise SystemExit(
                  f"PyPI already contains nsb-py=={version}: {filenames}. "
                  "Do not move or push the same release tag again. "
                  "For a partially published release, run the manual "
                  "'Release' workflow_dispatch recovery on main instead."
              )

      - uses: dtolnay/rust-toolchain@stable

      - name: Install nightly rustdoc toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-02

      - name: Install cargo-public-api
        run: cargo install cargo-public-api --locked --version 0.50.1 --force

      - name: Verify frozen public API
        shell: bash
        run: |
          set -euo pipefail
          test -f crates/nsb/api/API_FROZEN
          base="$(git rev-parse "${GITHUB_SHA}^")"
          scripts/check-public-api.sh --base "$base"

      - name: Verify release tag and cross-package metadata
        run: python scripts/check-release-metadata.py --tag "$GITHUB_REF_NAME"

      - name: Verify runtime-embedded asset redistribution terms
        shell: python
        run: |
          import tomllib
          from pathlib import Path

          assets = []
          for name in ["manifest.toml", "airglow-oxygen-manifest.toml"]:
              manifest = tomllib.loads((Path("crates/nsb/data") / name).read_text())
              assert manifest["schema_version"] == 1, name
              assets.extend(manifest["assets"])
          assert len({a["path"] for a in assets}) == len(assets), "duplicate asset path"
          blocked = []
          for asset in assets:
              if not asset.get("runtime_embedded", False):
                  continue
              license_text = str(asset.get("license", "")).strip()
              normalized = license_text.casefold()
              if (
                  not license_text
                  or "unresolved" in normalized
                  or "not recorded" in normalized
                  or "pending" in normalized
              ):
                  blocked.append((asset.get("path", "<unknown>"), license_text))

          if blocked:
              details = "\n".join(
                  f"  - {path}: {license_text or '<missing license>'}"
                  for path, license_text in blocked
              )
              raise SystemExit(
                  "release blocked: runtime-embedded assets lack resolved "
                  f"redistribution terms:\n{details}"
              )

      - name: Verify production Starlight against the human review
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p nsb-data-tools --locked -- dataset starlight promote \
            --repository-root . \
            --release-candidate docs/nsb_components/starlight/release-candidate/release-candidate-v1.toml \
            --redistribution-decision docs/nsb_components/starlight/release-candidate/redistribution-review-decision-v1.json \
            --output /tmp/starlight-production.toml
          python - <<'PYCODE'
          import tomllib
          from pathlib import Path
          expected = tomllib.loads(Path("/tmp/starlight-production.toml").read_text())["assets"]
          registry = {a["path"]: a for a in tomllib.loads(Path("crates/nsb/data/manifest.toml").read_text())["assets"]}
          for asset in expected:
              actual = registry[asset["path"]]
              assert actual["runtime_embedded"] and actual["calibration_status"] == "production"
              assert actual["sha256"] == asset["sha256"] and actual["schema"] == asset["schema"]
          PYCODE
          python - <<'PYCODE'
          import tomllib
          from pathlib import Path
          inventory = tomllib.loads(Path("docs/nsb_components/starlight/licensing/artifact-inventory-v1.toml").read_text())
          for artifact in inventory["artifacts"]:
              if artifact["id"] in {"compact-runtime-map-v1", "compact-runtime-sidecar-v1"}:
                  assert artifact["lifecycle"] == "published" and "git_repository" in artifact["channels"], "record actual Git publication before tagging"
          PYCODE

      - name: Verify scientific assets and regression matrices before publication
        run: |
          cargo test --workspace --all-targets --locked
          cargo test --workspace --doc --all-features --locked

      - name: Verify crates.io package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target/package
          cargo package -p nsb --locked
          cargo package -p nsb --list >> "$GITHUB_STEP_SUMMARY"
          crate="$(find target/package -maxdepth 1 -type f -name 'nsb-*.crate' -print -quit)"
          test -n "$crate"
          size="$(stat -c '%s' "$crate")"
          max_size=$((10 * 1024 * 1024))
          printf 'Package: %s\nSize: %s bytes\nLimit: %s bytes\n' "$crate" "$size" "$max_size"
          if (( size > max_size )); then
            echo "package exceeds the crates.io 10 MiB upload limit" >&2
            exit 1
          fi
          contents="$(tar -tzf "$crate")"
          if ! grep -Fq "/LICENSE" <<<"$contents"; then
            echo "crate omits the AGPL licence text" >&2
            exit 1
          fi
          if ! grep -Fq "/THIRD_PARTY_NOTICES.md" <<<"$contents"; then
            echo "crate omits scientific-data notices" >&2
            exit 1
          fi
          for asset in starlight_nside128.csv starlight_nside128.release.csv starlight_nside128.manifest.toml merge_report.json; do
            if grep -Fq "/data/$asset" <<<"$contents"; then
              echo "unapproved Starlight payload present in crate: $asset" >&2
              exit 1
            fi
          done

      - name: Verify packaged scientific assets
        shell: python
        run: |
          import hashlib
          import tarfile
          import tomllib
          from pathlib import Path
          archive = next(Path("target/package").glob("nsb-*.crate"))
          with tarfile.open(archive) as bundle:
              members = {m.name.split("/", 1)[1]: m for m in bundle.getmembers() if "/" in m.name}
              registries = ["data/manifest.toml", "data/airglow-oxygen-manifest.toml"]
              assets = []
              for path in registries:
                  registry = tomllib.loads(bundle.extractfile(members[path]).read().decode())
                  assert registry["schema_version"] == 1, path
                  assets.extend(registry["assets"])
              assert len({a["path"] for a in assets}) == len(assets), "duplicate asset path"
              approved = {a["path"]: a for a in assets if a.get("runtime_embedded")}
              for path, asset in approved.items():
                  payload = bundle.extractfile(members["data/" + path]).read()
                  assert hashlib.sha256(payload).hexdigest() == asset["sha256"], path
              for path in members:
                  if path.startswith("data/") and path not in registries:
                      assert path[5:] in approved, f"unregistered scientific payload: {path}"
              for path in ["LICENSE", "THIRD_PARTY_NOTICES.md", "AIRGLOW_DATA_NOTICES.md", *registries]:
                  assert bundle.extractfile(members[path]).read() == (Path("crates/nsb") / path).read_bytes(), path

      - name: Verify crates.io publish dry-run
        run: cargo publish --manifest-path crates/nsb/Cargo.toml --dry-run --locked

  linux-wheels:
    name: Linux wheel (${{ matrix.arch }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Build PyPI-compatible abi3 wheel
        uses: PyO3/maturin-action@v1.51.0
        with:
          command: build
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: >-
            --release
            --locked
            --compatibility pypi
            --out dist

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify installed wheel independently of the checkout
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl pytest
          python -c 'import nsb; assert nsb.ComponentMask.ALL.bits == nsb.ComponentMask.DEFAULT.bits == 15'
          python -c 'import zipfile, pathlib; w=next(pathlib.Path("dist").glob("*.whl")); assert any(n.endswith("THIRD_PARTY_NOTICES.md") for n in zipfile.ZipFile(w).namelist())'
          mkdir -p /tmp/nsb-wheel-tests
          cp python/tests/conftest.py python/tests/test_evaluation.py /tmp/nsb-wheel-tests/
          cd /tmp/nsb-wheel-tests
          python -m pytest -q

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  macos-wheels:
    name: macOS wheel (${{ matrix.arch }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Build PyPI-compatible abi3 wheel
        uses: PyO3/maturin-action@v1.51.0
        with:
          command: build
          maturin-version: ${{ env.MATURIN_VERSION }}
          args: >-
            --release
            --locked
            --compatibility pypi
            --out dist

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify installed wheel independently of the checkout
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl pytest
          python -c 'import nsb; assert nsb.ComponentMask.ALL.bits == nsb.ComponentMask.DEFAULT.bits == 15'
          python -c 'import zipfile, pathlib; w=next(pathlib.Path("dist").glob("*.whl")); assert any(n.endswith("THIRD_PARTY_NOTICES.md") for n in zipfile.ZipFile(w).namelist())'
          mkdir -p /tmp/nsb-wheel-tests
          cp python/tests/conftest.py python/tests/test_evaluation.py /tmp/nsb-wheel-tests/
          cd /tmp/nsb-wheel-tests
          python -m pytest -q

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  windows-wheels:
    name: Windows wheel (x86_64)
    needs: validate
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Build PyPI-compatible abi3 wheel
        uses: PyO3/maturin-action@v1.51.0
        with:
          command: build
          maturin-version: ${{ env.MATURIN_VERSION }}
          args: >-
            --release
            --locked
            --compatibility pypi
            --out dist

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify installed wheel independently of the checkout
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl pytest
          python -c 'import nsb; assert nsb.ComponentMask.ALL.bits == nsb.ComponentMask.DEFAULT.bits == 15'
          python -c 'import zipfile, pathlib; w=next(pathlib.Path("dist").glob("*.whl")); assert any(n.endswith("THIRD_PARTY_NOTICES.md") for n in zipfile.ZipFile(w).namelist())'
          mkdir -p /tmp/nsb-wheel-tests
          cp python/tests/conftest.py python/tests/test_evaluation.py /tmp/nsb-wheel-tests/
          cd /tmp/nsb-wheel-tests
          python -m pytest -q

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x86_64
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Python source distribution
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Build sdist
        uses: PyO3/maturin-action@v1.51.0
        with:
          command: sdist
          maturin-version: ${{ env.MATURIN_VERSION }}
          args: --out dist

      - name: Verify PEP 639 license files before publication
        run: python scripts/check-pypi-sdist-license.py dist/*.tar.gz

      - name: Reject unapproved Starlight in the Python source distribution
        shell: python
        run: |
          from pathlib import Path
          import tarfile
          import tomllib

          bundles = list(Path("dist").glob("*.tar.gz"))
          if len(bundles) != 1:
              raise SystemExit(f"expected one source distribution, found {bundles}")
          forbidden = {
              "starlight_nside128.csv",
              "starlight_nside128.release.csv",
              "starlight_nside128.manifest.toml",
              "merge_report.json",
          }
          with tarfile.open(bundles[0], "r:gz") as archive:
              leaked = sorted({
                  Path(member.name).name
                  for member in archive.getmembers()
                  if Path(member.name).name in forbidden
              })
              registries = ["manifest.toml", "airglow-oxygen-manifest.toml"]
              assets = []
              for name in registries:
                  registry = tomllib.loads((Path("crates/nsb/data") / name).read_text())
                  assert registry["schema_version"] == 1, name
                  assets.extend(registry["assets"])
              assert len({a["path"] for a in assets}) == len(assets), "duplicate asset path"
              approved = {a["path"] for a in assets if a.get("runtime_embedded")}
              found = set()
              for member in archive.getmembers():
                  if "/crates/nsb/data/" in member.name and member.isfile():
                      name = Path(member.name).name
                      if name not in registries and name not in approved:
                          leaked.append(member.name)
                      if name in approved:
                          found.add(name)
                          import hashlib
                          asset = next(a for a in assets if a["path"] == name)
                          assert hashlib.sha256(archive.extractfile(member).read()).hexdigest() == asset["sha256"]
              assert found == approved, f"missing runtime assets: {approved - found}"
              for relative in ["LICENSE", "THIRD_PARTY_NOTICES.md", "AIRGLOW_DATA_NOTICES.md", *("data/" + name for name in registries)]:
                  member = next(m for m in archive.getmembers() if m.name.endswith("/crates/nsb/" + relative))
                  assert archive.extractfile(member).read() == (Path("crates/nsb") / relative).read_bytes()
          if leaked:
              raise SystemExit(f"unapproved Starlight payload in sdist: {leaked}")

      - name: Verify source distribution builds a wheel
        run: python -m pip wheel --no-deps --wheel-dir /tmp/nsb-sdist-wheels dist/*.tar.gz

      - name: Verify installed wheel rebuilt from the approved source distribution
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install /tmp/nsb-sdist-wheels/nsb*.whl pytest
          python -c 'import nsb; assert nsb.ComponentMask.ALL.bits == nsb.ComponentMask.DEFAULT.bits == 15'
          cp -r python/tests /tmp/nsb-sdist-tests
          cd /tmp/nsb-sdist-tests
          python -m pytest -q

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-crates-io:
    name: Publish to crates.io
    needs:
      - validate
      - linux-wheels
      - macos-wheels
      - windows-wheels
      - sdist
    runs-on: ubuntu-24.04
    environment:
      name: crates.io
      url: https://crates.io/crates/nsb
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish nsb
        run: bash scripts/publish-changed.sh
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    needs:
      - publish-crates-io
      - linux-wheels
      - macos-wheels
      - windows-wheels
      - sdist
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/nsb-py/
    permissions:
      contents: read
      deployments: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show release artifacts
        run: ls -lah dist

      - name: Verify package versions in all release artifacts
        shell: python
        run: |
          import os
          from email.parser import BytesParser
          from pathlib import Path
          from zipfile import ZipFile

          expected = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          wheels = sorted(Path("dist").glob("*.whl"))
          sdists = sorted(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 5 or len(sdists) != 1:
              raise SystemExit(
                  f"expected exactly five wheels and one sdist, got "
                  f"{len(wheels)} wheels and {len(sdists)} sdists"
              )
          for wheel in wheels:
              if not wheel.name.startswith(f"nsb_py-{expected}-"):
                  raise SystemExit(f"unexpected wheel filename: {wheel.name}")
              with ZipFile(wheel) as archive:
                  metadata_files = [
                      name for name in archive.namelist()
                      if name.endswith(".dist-info/METADATA")
                  ]
                  if len(metadata_files) != 1:
                      raise SystemExit(f"missing or ambiguous wheel metadata: {wheel.name}")
                  metadata = BytesParser().parsebytes(archive.read(metadata_files[0]))
                  if metadata["Name"] != "nsb-py" or metadata["Version"] != expected:
                      raise SystemExit(f"wrong wheel metadata: {wheel.name}")
          if sdists[0].name != f"nsb_py-{expected}.tar.gz":
              raise SystemExit(f"unexpected sdist filename: {sdists[0].name}")

      - name: Publish nsb-py
        uses: pypa/gh-action-pypi-publish@v1.14.2

  recovery-validate:
    name: Validate partial PyPI recovery inputs
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.recovery_tag }}
          fetch-depth: 0
          lfs: false

      # Historic release tags predate the current verification helper.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: .release-tools
          lfs: false

      - name: Verify the two release runs and source compatibility
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.recovery_tag }}
          WHEELS_RUN: ${{ inputs.wheels_run_id }}
          SDIST_RUN: ${{ inputs.sdist_run_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Dispatch recovery from main"; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid tag"; exit 1; }
          [[ "$WHEELS_RUN" =~ ^[0-9]+$ && "$SDIST_RUN" =~ ^[0-9]+$ ]] || { echo "::error::Invalid run IDs"; exit 1; }
          [[ "$WHEELS_RUN" != "$SDIST_RUN" ]] || { echo "::error::Two distinct runs are required"; exit 1; }

          for run_id in "$WHEELS_RUN" "$SDIST_RUN"; do
            metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            RUN_METADATA="$metadata" python - <<'PYCODE'
          import json
          import os
          run = json.loads(os.environ["RUN_METADATA"])
          assert run["event"] == "push", "release artifacts must come from a push event"
          assert run["head_branch"] == os.environ["RELEASE_TAG"], "release tag mismatch"
          assert run["path"] == ".github/workflows/publish.yml", "unexpected workflow"
          PYCODE
          done

          wheels_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WHEELS_RUN" --jq .head_sha)"
          sdist_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SDIST_RUN" --jq .head_sha)"
          current_tag_sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$wheels_sha" "$sdist_sha" || { echo "::error::The original wheel commit is not an ancestor of the repaired sdist"; exit 1; }
          git merge-base --is-ancestor "$sdist_sha" "$current_tag_sha" || { echo "::error::The sdist run is not an ancestor of the current tag"; exit 1; }

          # The original wheels and repaired sdist can differ only in packaging
          # metadata or CI; binaries, scientific assets, and dependencies must match.
          while IFS= read -r changed; do
            case "$changed" in
              .github/workflows/ci.yml|.github/workflows/publish.yml|pyproject.toml|scripts/check-pypi-sdist-license.py) ;;
              *) echo "::error::Runtime/source change since wheel publication: $changed"; exit 1 ;;
            esac
          done < <(git diff --name-only "$wheels_sha" "$sdist_sha")

          # PR #253 added the manual recovery job after the already-validated
          # sdist was built. A subsequent tag move must not force us to rebuild
          # that sdist; allow only release workflow changes after that run.
          while IFS= read -r changed; do
            case "$changed" in
              .github/workflows/publish.yml) ;;
              *) echo "::error::Change after repaired sdist run: $changed"; exit 1 ;;
            esac
          done < <(git diff --name-only "$sdist_sha" "$current_tag_sha")

      - name: Download original published wheels
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.wheels_run_id }}
          pattern: wheels-*
          merge-multiple: true
          path: original-wheels
          github-token: ${{ github.token }}

      - name: Download repaired source distribution
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.sdist_run_id }}
          name: sdist
          path: dist
          github-token: ${{ github.token }}

      - name: Validate PyPI state, original wheel hashes, and repaired sdist
        env:
          RELEASE_TAG: ${{ inputs.recovery_tag }}
          RECOVERY_MODE: ${{ inputs.recovery_mode }}
        run: |
          python scripts/check-pypi-sdist-license.py dist/*.tar.gz
          python - <<'PYCODE'
          import hashlib
          import json
          import os
          from email.parser import BytesParser
          from pathlib import Path
          import tarfile
          from urllib.request import urlopen

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          sdist = Path("dist") / f"nsb_py-{version}.tar.gz"
          assert sdist.is_file() and len(list(Path("dist").glob("*"))) == 1
          with tarfile.open(sdist, "r:gz") as archive:
              metadata = BytesParser().parsebytes(
                  archive.extractfile(f"nsb_py-{version}/PKG-INFO").read(), headersonly=True
              )
              assert metadata["Name"] == "nsb-py" and metadata["Version"] == version

          wheels = sorted(Path("original-wheels").glob("*.whl"))
          assert len(wheels) == 5, f"expected five original wheels, got {wheels}"
          with urlopen(f"https://pypi.org/pypi/nsb-py/{version}/json", timeout=30) as response:
              published = {
                  file["filename"]: file
                  for file in json.load(response)["urls"]
              }
          if os.environ["RECOVERY_MODE"] == "pypi-sdist":
              assert sdist.name not in published, "sdist is already published on PyPI"
          else:
              assert sdist.name in published, "sdist is not published on PyPI"
              actual_sdist = hashlib.sha256(sdist.read_bytes()).hexdigest()
              assert actual_sdist == published[sdist.name]["digests"]["sha256"], "sdist differs from PyPI"
          for wheel in wheels:
              assert wheel.name.startswith(f"nsb_py-{version}-")
              assert wheel.name in published, f"wheel is not already on PyPI: {wheel.name}"
              actual = hashlib.sha256(wheel.read_bytes()).hexdigest()
              expected = published[wheel.name]["digests"]["sha256"]
              assert actual == expected, f"wheel differs from already-published file: {wheel.name}"
          print("Recovery verified: original wheels match PyPI; sdist state matches recovery mode.")
          PYCODE

      - name: Verify complete recovery distribution and published registry state
        env:
          RELEASE_TAG: ${{ inputs.recovery_tag }}
          RECOVERY_MODE: ${{ inputs.recovery_mode }}
        run: |
          set -euo pipefail
          cp original-wheels/*.whl dist/
          python .release-tools/scripts/release_assets.py verify --tag "$RELEASE_TAG" --dist dist
          if [[ "$RECOVERY_MODE" == "github-release" ]]; then
            python .release-tools/scripts/release_assets.py verify --tag "$RELEASE_TAG" --dist dist --published
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: recovery-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  recover-pypi-sdist:
    name: Publish only the missing PyPI sdist
    if: github.event_name == 'workflow_dispatch' && inputs.recovery_mode == 'pypi-sdist'
    needs: recovery-validate
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/nsb-py/
    permissions:
      contents: read
      deployments: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: recovery-sdist
          path: dist

      - name: Publish the repaired sdist (no wheels)
        uses: pypa/gh-action-pypi-publish@v1.14.2

  record-publication:
    name: Record successful scientific-data publication
    needs: [publish-pypi, recover-pypi-sdist, recovery-validate]
    if: ${{ !cancelled() && ((github.event_name == 'push' && needs.publish-pypi.result == 'success') || (github.event_name == 'workflow_dispatch' && ((inputs.recovery_mode == 'pypi-sdist' && needs.recover-pypi-sdist.result == 'success') || (inputs.recovery_mode == 'github-release' && needs.recovery-validate.result == 'success' && needs.recover-pypi-sdist.result == 'skipped')))) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_tag || github.ref }}
          lfs: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Derive actual publication inventory without changing approval
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p nsb-data-tools --locked -- dataset starlight promote \
            --repository-root . \
            --release-candidate docs/nsb_components/starlight/release-candidate/release-candidate-v1.toml \
            --redistribution-decision docs/nsb_components/starlight/release-candidate/redistribution-review-decision-v1.json \
            --apply --published-channel crates_io --published-channel pypi_wheel --published-channel pypi_sdist
          git diff --exit-code -- docs/nsb_components/starlight/licensing/approval-inventory-v1.toml \
            docs/nsb_components/starlight/licensing/approval-inventory-v2.toml \
            docs/nsb_components/starlight/release-candidate/review-bundle-v1.toml \
            docs/nsb_components/starlight/release-candidate/review-bundle-v2.toml \
            docs/nsb_components/starlight/release-candidate/approval-history \
            docs/nsb_components/starlight/release-candidate/redistribution-review-decision-v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: publication-inventory
          path: docs/nsb_components/starlight/licensing/artifact-inventory-v1.toml
          if-no-files-found: error

  publish-github-release:
    name: Publish GitHub Release
    needs: [record-publication, publish-crates-io, publish-pypi, recover-pypi-sdist, recovery-validate]
    # The explicit status function bypasses implicit success() when the
    # unused publication/recovery branch is skipped.
    if: >-
      ${{
        !cancelled() &&
        needs.record-publication.result == 'success' &&
        (
          (github.event_name == 'push' &&
           needs.publish-crates-io.result == 'success' &&
           needs.publish-pypi.result == 'success') ||
          (github.event_name == 'workflow_dispatch' &&
           needs.recovery-validate.result == 'success' &&
           (needs.recover-pypi-sdist.result == 'success' ||
            (inputs.recovery_mode == 'github-release' &&
             needs.recover-pypi-sdist.result == 'skipped')))
        )
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_tag || github.ref }}
          fetch-depth: 0
          lfs: false

      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: main
          path: .release-tools
          lfs: false

      - name: Download built wheels for normal publication
        if: github.event_name == 'push'
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download built sdist for normal publication
        if: github.event_name == 'push'
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Download original published wheels for recovery
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.wheels_run_id }}
          pattern: wheels-*
          merge-multiple: true
          path: dist
          github-token: ${{ github.token }}

      - name: Download validated source distribution for recovery
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: recovery-sdist
          path: dist

      - name: Verify registries and assets, then create immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          tool=scripts/release_assets.py
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tool=.release-tools/scripts/release_assets.py
          fi
          python "$tool" notes --tag "$RELEASE_TAG" --changelog CHANGELOG.md --output release-notes.md
          python "$tool" verify --tag "$RELEASE_TAG" --dist dist --published

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $RELEASE_TAG already exists; leaving notes and assets untouched"
            exit 0
          fi

          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz \
            --verify-tag \
            --notes-file release-notes.md \
            --title "NSB $RELEASE_TAG"
