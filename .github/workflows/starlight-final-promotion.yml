name: Starlight final promotion

# Manual, post-approval workflow owned by issue #103 and implemented by #102.
# After valid signed scientific and redistribution decisions exist, it packs
# the frozen candidate into a runtime-loadable map, applies production
# registry entries, re-runs required gates, and opens or updates the
# promotion pull request. It never rewrites candidate map bytes.

on:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: >-
          Path to the nsb-starlight-release-candidate-v1 manifest.
        required: true
        default: docs/nsb_components/starlight/release-candidate/release-candidate-v1.toml
      review_bundle:
        description: >-
          Path to the checksum-pinned evidence bundle reviewed by issue #103.
        required: true
        default: docs/nsb_components/starlight/release-candidate/review-bundle-v1.toml
      scientific_decision:
        description: >-
          Path to the signed scientific-review decision file (owned by
          issue #103).
        required: true
        default: docs/nsb_components/starlight/release-candidate/scientific-review-decision-v1.json
      redistribution_decision:
        description: >-
          Path to the signed redistribution-review decision file (owned by
          issue #103).
        required: true
        default: docs/nsb_components/starlight/release-candidate/redistribution-review-decision-v1.json
      candidate_map:
        description: Path to the canonical Starlight candidate map.
        required: true
        default: crates/nsb/data/starlight_nside128.csv

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  promote:
    name: Pack, apply, validate, and open promotion PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved main only
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: false

      - name: Require promotion dispatch from main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::final Starlight promotion may only be dispatched from refs/heads/main; got ${GITHUB_REF}" >&2
            exit 1
          fi
          git fetch origin main --no-tags --depth=1
          head="$(git rev-parse HEAD)"
          origin_main="$(git rev-parse origin/main)"
          if [[ "$head" != "$origin_main" ]]; then
            echo "::error::checked-out promotion commit $head is not the current origin/main $origin_main" >&2
            exit 1
          fi
          echo "promotion source verified at main commit $head"

      - name: Verify decision files exist
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for path in \
            "${{ inputs.release_candidate }}" \
            "${{ inputs.review_bundle }}" \
            "${{ inputs.scientific_decision }}" \
            "${{ inputs.redistribution_decision }}" \
            "${{ inputs.candidate_map }}"; do
            if [[ ! -f "$path" ]]; then
              echo "::error::required file is missing: $path" >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "fail-closed: one or more required inputs are missing; see errors above." >&2
            echo "the scientific and redistribution decisions are owned exclusively by issue #103" >&2
            exit 1
          fi

      - name: Verify frozen human review bundle
        run: |
          python3 .github/scripts/verify_starlight_review_bundle.py \
            --repository-root . \
            --bundle "${{ inputs.review_bundle }}" \
            --scientific-decision "${{ inputs.scientific_decision }}" \
            --redistribution-decision "${{ inputs.redistribution_decision }}"

      - name: Record pre-promotion candidate map checksum
        id: pre_checksum
        shell: bash
        run: |
          set -euo pipefail
          echo "sha256=$(sha256sum "${{ inputs.candidate_map }}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Pack runtime map and apply production registry
        run: |
          cargo run --locked -p nsb-data-tools --bin nsb-data -- \
            dataset starlight promote \
            --release-candidate "${{ inputs.release_candidate }}" \
            --scientific-decision "${{ inputs.scientific_decision }}" \
            --redistribution-decision "${{ inputs.redistribution_decision }}" \
            --repository-root . \
            --output /tmp/starlight-production-manifest-draft.toml \
            --apply

      - name: Assert candidate map checksum is unchanged
        shell: bash
        run: |
          set -euo pipefail
          before="${{ steps.pre_checksum.outputs.sha256 }}"
          after="$(sha256sum "${{ inputs.candidate_map }}" | cut -d' ' -f1)"
          if [[ "$before" != "$after" ]]; then
            echo "::error::candidate map checksum changed during promotion: before=$before after=$after" >&2
            exit 1
          fi
          echo "candidate map checksum unchanged: $after"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --lib --bins --tests --examples --all-features --locked

      - name: Clippy
        run: cargo clippy --workspace --lib --bins --tests --examples --all-features --locked -- -D warnings

      - name: Unit tests
        run: cargo test --workspace --lib --bins --all-features --locked

      - name: Runtime integration tests
        run: cargo test --locked -p nsb --tests --all-features

      - name: CLI integration tests
        run: cargo test --locked -p nsb-cli --tests --all-features

      - name: Data tools and scientific assets
        run: |
          cargo test --locked -p nsb-data-tools --tests --all-features
          cargo test --locked -p nsb-data-tools --test scientific_assets repository_scientific_asset_registry_verify -- --exact

      - name: Doctests
        run: cargo test --workspace --doc --all-features --locked

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Release build
        run: cargo build --workspace --release --all-features --locked

      - name: Dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Starlight production asset admission
        run: |
          cargo test --locked -p nsb --lib --all-features components::starlight
          cargo test --locked -p nsb --lib --all-features bundled_production
          cargo test --locked -p nsb --tests --all-features query_api
          cargo test --locked -p nsb-data-tools --lib pack::tests::canonical_nside128_pack_is_deterministic_and_runtime_loadable -- --exact

      - name: MSRV 1.89
        uses: dtolnay/rust-toolchain@1.89

      - name: Check workspace at MSRV
        run: cargo check --workspace --lib --bins --locked

      - name: Open or update promotion pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          REMOTE=origin
          BRANCH=starlight/production-promotion
          STASH_DIR=/tmp/nsb-starlight-promotion-assets
          mkdir -p "$STASH_DIR"
          cp crates/nsb/data/manifest.toml "$STASH_DIR/manifest.toml"
          shopt -s nullglob
          for file in crates/nsb/data/*.release.csv crates/nsb/data/*.manifest.toml; do
            cp "$file" "$STASH_DIR/$(basename "$file")"
          done

          git fetch "$REMOTE" "$BRANCH" || true
          git fetch "$REMOTE" main || true
          if git show-ref --verify --quiet "refs/remotes/${REMOTE}/${BRANCH}"; then
            if git show-ref --verify --quiet "refs/remotes/${REMOTE}/main"; then
              unexpected="$(
                git diff --name-only "${REMOTE}/main...${REMOTE}/${BRANCH}" \
                  | grep -v -E '^crates/nsb/data/manifest\.toml$' \
                  | grep -v -E '^crates/nsb/data/.*\.release\.csv$' \
                  | grep -v -E '^crates/nsb/data/.*\.manifest\.toml$' \
                  || true
              )"
              if [[ -n "${unexpected}" ]]; then
                echo "fail-closed: ${REMOTE}/${BRANCH} contains unexpected paths versus ${REMOTE}/main:" >&2
                echo "${unexpected}" >&2
                exit 1
              fi
            fi
            git checkout -B "$BRANCH" "${REMOTE}/${BRANCH}"
          else
            git checkout -B "$BRANCH" HEAD
          fi

          mkdir -p crates/nsb/data
          cp "$STASH_DIR/manifest.toml" crates/nsb/data/manifest.toml
          for file in "$STASH_DIR"/*.release.csv "$STASH_DIR"/*.manifest.toml; do
            [[ -e "$file" ]] || continue
            cp "$file" "crates/nsb/data/$(basename "$file")"
          done

          git add crates/nsb/data/manifest.toml crates/nsb/data/*.release.csv crates/nsb/data/*.manifest.toml || true
          if git diff --cached --quiet; then
            echo "promotion assets unchanged"
          else
            git commit -m "Register packed Starlight production runtime assets after #103 approval."
          fi

          if git show-ref --verify --quiet "refs/remotes/${REMOTE}/${BRANCH}"; then
            expected="$(git rev-parse "${REMOTE}/${BRANCH}")"
            git push --force-with-lease="${BRANCH}:${expected}" "$REMOTE" "HEAD:${BRANCH}"
          else
            git push -u "$REMOTE" "HEAD:${BRANCH}"
          fi

          if gh pr view starlight/production-promotion --json number >/dev/null 2>&1; then
            gh pr edit starlight/production-promotion --title "Promote approved Starlight UV-v2 runtime assets" --body "$(cat <<'EOF'
          ## Summary
          - Packed runtime map and sidecar generated from the frozen candidate.
          - Production registry entries applied by `dataset starlight promote --apply`.
          - Candidate map bytes were not rewritten.

          ## Test plan
          - [ ] Candidate SHA-256 unchanged
          - [ ] Bundled production Starlight loads after merge
          - [ ] Required CI gates on this PR are green
          EOF
          )"
          else
            gh pr create --title "Promote approved Starlight UV-v2 runtime assets" --body "$(cat <<'EOF'
          ## Summary
          - Packed runtime map and sidecar generated from the frozen candidate.
          - Production registry entries applied by `dataset starlight promote --apply`.
          - Candidate map bytes were not rewritten.

          ## Test plan
          - [ ] Candidate SHA-256 unchanged
          - [ ] Bundled production Starlight loads after merge
          - [ ] Required CI gates on this PR are green
          EOF
          )"
          fi