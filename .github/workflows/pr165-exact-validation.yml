name: PR 165 Exact Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr165-exact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  exact-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy all targets
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test all targets
        run: cargo test --workspace --all-targets --locked
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps
      - name: Install nightly rustdoc toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-02
          components: rustdoc
      - name: Install cargo-public-api
        run: cargo install cargo-public-api --locked --version 0.50.1 --force
      - name: Public API policy
        run: cargo run --locked -p nsb-public-api-gate -- --base "${{ github.event.pull_request.base.sha }}"
