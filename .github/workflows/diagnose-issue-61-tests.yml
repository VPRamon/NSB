name: Diagnose issue 61 tests

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/diagnose-issue-61-tests.yml

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Capture workspace test failure
        shell: bash
        run: |
          set +e
          cargo test --workspace --all-targets --all-features --locked -- --nocapture --test-threads=1 > issue-61-test-full.log 2>&1
          status=$?
          {
            echo "workspace_test_status=$status"
            echo '=== last 500 lines ==='
            tail -n 500 issue-61-test-full.log
          } > issue-61-test-diagnostic.log
          rm -f issue-61-test-full.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add issue-61-test-diagnostic.log
          git commit -m "ci: capture failing workspace test tail"
          git push origin HEAD:${{ github.head_ref }}
