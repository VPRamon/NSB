name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust release gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings 2>&1 | tee clippy-pr69.log
      - name: Upload Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-pr69-latest
          path: clippy-pr69.log
          if-no-files-found: ignore
      - name: Locked tests
        shell: bash
        run: |
          set -o pipefail
          timeout 6m cargo test --workspace --all-targets --all-features --locked -- --test-threads=1 --nocapture 2>&1 | tee tests-pr69.log
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-pr69-latest
          path: tests-pr69.log
          if-no-files-found: ignore
      - name: Locked doctests
        run: cargo test --workspace --doc --locked
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked
      - name: Locked release build
        run: cargo build --workspace --release --all-features --locked
      - name: Verify scientific assets
        run: cargo run --locked -p nsb-data-tools --bin nsb-data -- assets verify --manifest crates/nsb/data/manifest.toml
      - name: Reject removed production APIs
        shell: bash
        run: |
          if rg -n 'ALL_SUPPORTED|python_parity|periods_below_threshold_legacy|#\[deprecated|allow\(dead_code\)' crates/*/src; then
            echo 'removed or compatibility-only API found in production source' >&2
            exit 1
          fi

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  msrv:
    name: Rust 1.89 library check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install MSRV
        uses: dtolnay/rust-toolchain@1.89
      - name: Check runtime library at MSRV
        run: cargo check --locked -p nsb --lib
