name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_CI_TARGETS: --lib --bins --tests --examples

jobs:
  check-license-headers:
    name: Check license headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify SPDX headers
        run: bash scripts/check-license-headers.sh

  release_metadata:
    name: Release metadata preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check Rust, Python, workspace versions and release inputs
        run: python scripts/check-release-metadata.py

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without Git LFS payloads
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Enforce cfg(test) module boundaries
        run: |
          bash scripts/check-cfg-test-boundaries.sh
          bash scripts/test-cfg-test-boundaries.sh
      - name: Install Rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  check:
    name: Check (all features)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without Git LFS payloads
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Check workspace targets
        run: cargo check --workspace $CARGO_CI_TARGETS --all-features --locked
      - name: Check NSB without default features
        run: cargo check -p nsb --lib --no-default-features --locked

  clippy:
    name: Clippy (all features)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without Git LFS payloads
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Run Clippy
        run: cargo clippy --workspace $CARGO_CI_TARGETS --all-features --locked -- -D warnings

  unit_tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without Git LFS payloads
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Run library and binary unit tests
        run: cargo test --workspace --lib --bins --all-features --locked
      - name: Run all workspace targets acceptance gate
        run: cargo test --workspace --all-targets --locked
      - name: Test coverage gate
        run: scripts/test-coverage-gate.sh

  runtime_integration_tests:
    name: Runtime integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without Git LFS payloads
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Test nsb integrations
        run: cargo test --locked -p nsb --tests --all-features

  cli_tests:
    name: CLI integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without Git LFS payloads
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Test nsb-cli integrations
        run: cargo test --locked -p nsb-cli --tests --all-features

  data_tools_tests:
    name: Data tools and scientific assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without Git LFS payloads
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Test nsb-data-tools integrations
        run: cargo test --locked -p nsb-data-tools --tests --all-features
      - name: Verify scientific asset registry explicitly
        run: cargo test --locked -p nsb-data-tools --test scientific_assets repository_scientific_asset_registry_verify -- --exact

      - name: Stage an isolated embedded Starlight test fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture="${RUNNER_TEMP}/nsb-embedded-fixture"
          mkdir -p "$fixture"
          python - <<'PYCODE'
          import json
          import os
          import shutil
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "nsb-embedded-fixture"
          shutil.copytree("crates/nsb", root / "crates/nsb")
          shutil.copytree("docs/nsb_components/starlight", root / "docs/nsb_components/starlight")
          shutil.copy2("Cargo.lock", root / "Cargo.lock")
          shutil.copy2("pyproject.toml", root / "pyproject.toml")
          shutil.copy2("LICENSE", root / "LICENSE")
          (root / "Cargo.toml").write_text('[workspace]\nmembers = ["crates/nsb"]\nresolver = "2"\n')
          # Explicit synthetic authorization exists only in this isolated test
          # repository. Neither it nor its payload is a published release.
          rc = root / "docs/nsb_components/starlight/release-candidate"
          decision = json.loads((rc / "redistribution-review-decision-template-v1.json").read_text())
          decision.update(reviewer_name="Synthetic CI fixture; no real authorization",
              reviewer_role="Temporary integration test", reviewed_at_utc="2026-01-01T00:00:00Z")
          (rc / "redistribution-review-decision-v1.json").write_text(json.dumps(decision, indent=2) + "\n")
          (root / "crates/nsb/tests/embedded_fixture.rs").write_text('''
          use nsb::{ComponentMask, NsbEvaluator, PointQuery, Target, DEG};
          use nsb::components::starlight::StarlightProduct;
          use siderust::coordinates::transform::TransformFrame;
          #[test]
          fn embedded_default_has_all_four_components_without_skipping() {
              assert!(StarlightProduct::bundled_production_available());
              assert_eq!(ComponentMask::ALL.bits(), 15);
              assert_eq!(ComponentMask::DEFAULT.bits(), 15);
              let time = tempoch::Time::<tempoch::UTC>::from_chrono(
                  chrono::DateTime::parse_from_rfc3339("2023-09-04T01:48:00Z").unwrap().with_timezone(&chrono::Utc));
              let target: Target = siderust::coordinates::spherical::direction::ICRS::new(266.41683 * DEG, -29.00781 * DEG).to_frame();
              let result = NsbEvaluator::new().unwrap().evaluate(&PointQuery::new(
                  siderust::coordinates::centers::Geodetic::new_raw(
                      siderust::qtty::Degrees::new(-70.31634444444444),
                      siderust::qtty::Degrees::new(-24.683427777777776),
                      siderust::qtty::Meters::new(2184.6)), time,
                  target)).unwrap();
              assert_eq!(result.components.len(), 4);
              assert!(result.components.iter().find(|c| c.name == "starlight").unwrap().integrated.value() > 0.0);
              assert_eq!(result.integrated.value(), result.components.iter().map(|c| c.integrated.value()).sum::<f64>());
              let values = serde_json::json!({"total": result.integrated.value(),
                  "components": result.components.iter().map(|c| (c.name.to_string(), c.integrated.value())).collect::<std::collections::BTreeMap<_, _>>()});
              std::fs::write(std::env::var("NSB_FIXTURE_RESULT").unwrap(), serde_json::to_vec(&values).unwrap()).unwrap();
          }
          ''')
          PYCODE
          cargo run --locked -p nsb-data-tools --bin nsb-data -- dataset starlight promote \
            --repository-root "$fixture" \
            --release-candidate "$fixture/docs/nsb_components/starlight/release-candidate/release-candidate-v1.toml" \
            --redistribution-decision "$fixture/docs/nsb_components/starlight/release-candidate/redistribution-review-decision-v1.json" \
            --apply
          # The fixture contains only nsb, so the original workspace lockfile needs
          # reconciling. Do that in the temporary fixture and fetch missing crates
          # before requiring an immutable, offline dependency graph for the tests.
          cargo fetch --manifest-path "$fixture/Cargo.toml"
          cargo metadata --manifest-path "$fixture/Cargo.toml" --locked --offline --format-version 1 > /dev/null
          NSB_FIXTURE_RESULT="$fixture/rust-result.json" cargo test --manifest-path "$fixture/Cargo.toml" -p nsb --test embedded_fixture \
            --locked --offline --target-dir "$PWD/target"
          cargo package --manifest-path "$fixture/crates/nsb/Cargo.toml" --locked --target-dir "$PWD/target"
          crate="$(find target/package -maxdepth 1 -type f -name 'nsb-*.crate' -print -quit)"
          test -n "$crate"
          test "$(stat -c '%s' "$crate")" -lt "$((10 * 1024 * 1024))"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test the isolated four-component wheel outside its source tree
        shell: bash
        run: |
          set -euo pipefail
          fixture="${RUNNER_TEMP}/nsb-embedded-fixture"
          python -m pip install maturin==1.15.0 pytest
          python -m maturin build --release --locked \
            --manifest-path "$fixture/crates/nsb/Cargo.toml" --target-dir "$PWD/target" --out "$fixture/wheels"
          python -m pip install --force-reinstall "$fixture"/wheels/*.whl
          mkdir -p "$fixture/wheel-tests"
          cp -r python/tests/. "$fixture/wheel-tests"
          cp "$fixture/rust-result.json" "$fixture/wheel-tests/rust-result.json"
          cat > "$fixture/wheel-tests/test_embedded_parity.py" <<'PYCODE'
          import json
          from pathlib import Path
          import nsb
          import pytest
          def test_embedded_four_component_rust_python_parity(observer, direction, point_time):
              result = nsb.NsbEvaluator().evaluate(nsb.PointQuery(observer, point_time, direction))
              reference = json.loads(Path("rust-result.json").read_text())
              assert nsb.ComponentMask.ALL.bits == nsb.ComponentMask.DEFAULT.bits == 15
              assert len(result.components) == 4
              assert result.integrated_photons_cm2_ns_sr == pytest.approx(reference["total"], rel=1e-12, abs=1e-12)
              for component in result.components:
                  assert component.integrated_photons_cm2_ns_sr == pytest.approx(reference["components"][component.name], rel=1e-12, abs=1e-12)
              assert next(c for c in result.components if c.name == "starlight").integrated_photons_cm2_ns_sr > 0
          PYCODE
          cd "$fixture/wheel-tests"
          python -c 'import nsb; assert nsb.ComponentMask.ALL.bits == nsb.ComponentMask.DEFAULT.bits == 15'
          python -m pytest -q
          cd "$fixture"
          python -m maturin sdist --manifest-path "$fixture/crates/nsb/Cargo.toml" --out "$fixture/sdist"
          python "$GITHUB_WORKSPACE/scripts/check-pypi-sdist-license.py" "$fixture"/sdist/*.tar.gz
          python - <<'PYCODE'
          import tarfile
          from pathlib import Path
          archive = next(Path("sdist").glob("*.tar.gz"))
          with tarfile.open(archive) as source:
              names = source.getnames()
              assert any(n.endswith("/crates/nsb/THIRD_PARTY_NOTICES.md") for n in names)
              assert any(n.endswith("/crates/nsb/LICENSE") for n in names)
              assert any(n.endswith("/starlight_nside128.compact.release.bin") for n in names)
              assert not any(n.endswith("/starlight_nside128.csv") or n.endswith("/merge_report.json") or "redistribution-review-decision" in n for n in names)
              source.extractall("sdist-build", filter="data")
          PYCODE
          cd "$fixture"/sdist-build/*
          python -m maturin build --release --manifest-path crates/nsb/Cargo.toml \
            --target-dir "$fixture/sdist-target" --out "$fixture/sdist-wheels"
          python -m pip install --force-reinstall "$fixture"/sdist-wheels/*.whl
          cd "$fixture/wheel-tests"
          python -c 'import nsb; assert nsb.ComponentMask.ALL.bits == nsb.ComponentMask.DEFAULT.bits == 15'
          python -m pytest -q

  doctests:
    name: Doctests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without Git LFS payloads
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Run doctests
        run: cargo test --workspace --doc --all-features --locked

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without Git LFS payloads
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

  release:
    name: Release build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without Git LFS payloads
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Build release workspace
        run: cargo build --workspace --release --all-features --locked
      - name: Verify publishable nsb crate excludes unapproved Starlight assets
        shell: bash
        run: |
          set -euo pipefail
          cargo package -p nsb --locked
          crate="$(find target/package -maxdepth 1 -name 'nsb-*.crate' -print -quit)"
          test -n "$crate"
          contents="$(tar -tzf "$crate")"
          if ! grep -Fq "/THIRD_PARTY_NOTICES.md" <<<"$contents"; then
            echo "::error::published crate omits required scientific-data notices" >&2
            exit 1
          fi
          crate_bytes="$(stat -c %s "$crate")"
          if (( crate_bytes > 10485760 )); then
            echo "::error::nsb crate exceeds 10 MiB upload limit ($crate_bytes bytes)" >&2
            exit 1
          fi
          for asset in \
            starlight_nside128.csv \
            starlight_nside128.release.csv \
            starlight_nside128.manifest.toml \
            merge_report.json; do
            if grep -Fq "/data/$asset" <<<"$contents"; then
              echo "::error::unapproved Starlight asset is present in publishable crate: $asset" >&2
              exit 1
            fi
          done

  dependency_policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without Git LFS payloads
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  api_policy:
    name: Public API policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without Git LFS payloads
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Install nightly rustdoc toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-02
      - name: Install stable Rust for cargo install
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: public-api
      - name: Install cargo-public-api
        run: cargo install cargo-public-api --locked --version 0.50.1 --force
      - name: Resolve public API SemVer base
        id: api_base
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            BEFORE="${{ github.event.before }}"
            if [[ -z "$BEFORE" ]]; then
              echo "push event is missing github.event.before; refuse empty SemVer base" >&2
              exit 1
            fi
            echo "base=${BEFORE}" >> "$GITHUB_OUTPUT"
          else
            echo "unsupported event for public API policy: ${{ github.event_name }}" >&2
            exit 1
          fi
      - name: Test public API lifecycle in an isolated repository
        run: scripts/test-check-public-api.sh
      - name: Check public API snapshot and SemVer gate
        env:
          NSB_PUBLIC_API_BASE: ${{ steps.api_base.outputs.base }}
        run: scripts/check-public-api.sh --base "$NSB_PUBLIC_API_BASE"

  msrv:
    name: Rust 1.89 workspace check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without Git LFS payloads
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install MSRV
        uses: dtolnay/rust-toolchain@1.89
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Check workspace at MSRV
        run: cargo check --workspace --lib --bins --locked

  coverage:
    name: Test and coverage
    # Draft release-preparation changes must satisfy the same coverage floors.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout without Git LFS payloads
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Install nightly Rust and LLVM tools
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-02
          components: llvm-tools-preview
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.0
      - name: Clean previous coverage data
        run: cargo +nightly-2026-09-02 llvm-cov clean --workspace
      - name: Collect Rust implementation coverage
        # Python adapter coverage is owned by the installed-wheel jobs below.
        run: cargo +nightly-2026-09-02 llvm-cov --workspace --doctests --locked --no-report
      - name: Write Cobertura report
        run: cargo +nightly-2026-09-02 llvm-cov report --cobertura --output-path coverage.xml
      - name: Write JSON report
        run: cargo +nightly-2026-09-02 llvm-cov report --json --output-path coverage.json
      - name: Write LCOV report
        run: cargo +nightly-2026-09-02 llvm-cov report --lcov --output-path coverage.lcov
      - name: Write HTML report
        run: cargo +nightly-2026-09-02 llvm-cov report --html --output-dir coverage_html
      - name: Build coverage summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          format: markdown
          output: file
      - name: Publish coverage to job summary
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post or update coverage comment
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}
        uses: mshick/add-pr-comment@v2
        with:
          message-id: nsb-coverage
          message-path: code-coverage-results.md
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage_html
          retention-days: 7
      - name: Upload coverage JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: coverage.json
          retention-days: 7
      - name: Upload coverage Cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: coverage.xml
          retention-days: 7
      - name: Upload coverage LCOV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage.lcov
          retention-days: 7
      - name: Enforce coverage floors
        env:
          ARTIFACT_HINT: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          status=0
          scripts/coverage-gate.sh \
            overall \
            --lcov coverage.lcov \
            --policy coverage-policy.toml \
            --artifact-hint "$ARTIFACT_HINT" \
            | tee coverage-gate-overall.txt || status=1
          cat coverage-gate-overall.txt >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            scripts/coverage-gate.sh \
              diff \
              --lcov coverage.lcov \
              --policy coverage-policy.toml \
              --base "${{ github.event.pull_request.base.sha }}" \
              --artifact-hint "$ARTIFACT_HINT" \
              | tee coverage-gate-diff.txt || status=1
            cat coverage-gate-diff.txt >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"


  python_bindings:
    name: Python abi3 wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            manylinux: "2_28"
            container: "auto"
            venv-python: ./.wheel-venv/bin/python
            additional-python: "3.14"
            additional-venv-python: ./.wheel-venv-314/bin/python
          - os: macos-14
            # Exercise macOS interoperability with an installed CPython 3.11 wheel.
            python-version: "3.11"
            manylinux: "off"
            container: "off"
            venv-python: ./.wheel-venv/bin/python
          - os: windows-latest
            python-version: "3.10"
            manylinux: "off"
            container: "off"
            venv-python: ./.wheel-venv/Scripts/python.exe
    steps:
      - name: Checkout without Git LFS payloads
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          maturin-version: v1.15.0
          args: --release --locked --out dist
          manylinux: ${{ matrix.manylinux }}
          container: ${{ matrix.container }}
      - name: Create clean wheel-test environment
        run: python -m venv .wheel-venv
      - name: Install wheel test dependencies from PyPI
        run: ${{ matrix.venv-python }} -m pip install --upgrade pip "pytest>=8,<10"
      - name: Install exact built wheel and resolve runtime dependencies from PyPI
        run: |
          ${{ matrix.venv-python }} -c "import pathlib, subprocess, sys; wheels = list(pathlib.Path('dist').glob('*.whl')); assert len(wheels) == 1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--only-binary=:all:', str(wheels[0])])"
      - name: Test installed wheel
        run: ${{ matrix.venv-python }} -m pytest python/tests -q
      - name: Set up additional Linux Python
        if: ${{ matrix.additional-python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.additional-python }}
      - name: Test the same installed wheel on additional Linux Python
        if: ${{ matrix.additional-python }}
        run: |
          python -m venv .wheel-venv-314
          ${{ matrix.additional-venv-python }} -m pip install --upgrade pip "pytest>=8,<10"
          ${{ matrix.additional-venv-python }} -c "import pathlib, subprocess, sys; wheels = list(pathlib.Path('dist').glob('*.whl')); assert len(wheels) == 1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--only-binary=:all:', str(wheels[0])])"
          ${{ matrix.additional-venv-python }} -m pytest python/tests -q
