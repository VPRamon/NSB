name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust release gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Locked tests
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Locked doctests
        run: cargo test --workspace --doc --locked
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked
      - name: Locked release build
        run: cargo build --workspace --release --all-features --locked
      - name: Verify scientific asset registry
        run: cargo test --locked -p nsb-data-tools --test scientific_assets repository_scientific_asset_registry_verify -- --exact
      - name: Verify lightweight Starlight pipeline fixture
        run: cargo test --locked -p nsb-data-tools --lib starlight::worker::tests::paired_partition_builds_a_strict_shard_and_maps -- --exact
      - name: Reject removed production APIs
        shell: bash
        run: |
          if rg -n 'ALL_SUPPORTED|python_parity|periods_below_threshold_legacy|#\[deprecated|allow\(dead_code\)' crates/*/src; then
            echo 'removed or compatibility-only API found in production source' >&2
            exit 1
          fi

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  msrv:
    name: Rust 1.89 library check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install MSRV
        uses: dtolnay/rust-toolchain@1.89
      - name: Check runtime library at MSRV
        run: cargo check --locked -p nsb --lib
