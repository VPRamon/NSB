name: Issue 60 final formatting

on:
  push:
    branches: [agent/resolve-issue-60]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/resolve-issue-60
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - shell: bash
        run: |
          rm .github/workflows/issue-60-format-test.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style: apply final rustfmt"
          git push origin HEAD:agent/resolve-issue-60
