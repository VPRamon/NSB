[package]
name = "nsb"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
authors = ["VPRamon <vallespuigramon@gmail.com>"]
description = "Night-sky background evaluation and observation planning for ground-based astronomy."
license = "AGPL-3.0-only"
repository = "https://github.com/VPRamon/NSB"
documentation = "https://docs.rs/nsb"
readme = "README.md"
publish = ["crates-io"]
# The frozen Starlight candidate is retained in Git, but redistribution as a
# production runtime asset requires the separate human review in issue #103.
# Cargo packages must never contain these four repository-only candidates.
exclude = [
    "data/starlight_nside128.csv",
    "data/starlight_nside128.release.csv",
    "data/starlight_nside128.manifest.toml",
    "data/merge_report.json",
]
keywords = ["astronomy", "atmosphere", "sky-brightness", "ctao", "nsb"]
categories = ["science"]

[lib]
name = "nsb"
crate-type = ["rlib", "cdylib"]

[features]
# Preserve the previously enabled Siderust serde support for existing users.
# Consumers can opt out with `default-features = false`.
default = ["serde"]
# Enable serialization for the upstream coordinate, quantity and time types
# exposed through NSB (Siderust forwards serde to its own dependencies).
serde = ["siderust/serde", "tempoch/serde"]
python = ["dep:pyo3", "dep:siderust-py", "dep:tempoch-py"]

[dependencies]
# qtty and optica are consumed through Siderust's public re-exports so NSB
# cannot accidentally compile against a different instance of those API types.
tempoch  = "0.7"
pyo3     = { version = "0.29.2", optional = true, features = ["abi3-py310"] }
siderust-py = { version = "0.2.2", optional = true }
tempoch-py  = { version = "0.2.1", optional = true }
siderust = { version = "0.12.0", default-features = false, features = ["std", "atmosphere", "photometry"] }

thiserror = "2.0"
bitflags  = "2.13"
chrono    = "0.4"
csv       = "1"
log       = "0.4"
rayon     = "1.11"
serde     = { version = "1", features = ["derive"] }
toml      = "1.1.2"
serde_json = "1"
sha2 = "0.11"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
toml = "1.1.2"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["html_reports"] }
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "ttf", "fontconfig-dlopen"] }

[[bench]]
name = "threshold_window"
harness = false

[[bench]]
name = "airglow_geometry"
harness = false
