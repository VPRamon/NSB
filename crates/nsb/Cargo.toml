[package]
name = "nsb"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
authors = ["VPRamon <vallespuigramon@gmail.com>"]
description = "Night Sky Background model."
license = "AGPL-3.0-only"
repository = "https://github.com/VPRamon/NSB"
readme = "README.md"
keywords = ["astronomy", "atmosphere", "sky-brightness", "ctao", "nsb"]
categories = ["science"]

[lib]
name = "nsb"

[dependencies]
qtty     = { version = "0.8", features = ["radiometry", "astro", "photometry"] }
tempoch  = "0.6"
optica   = "0.2"
siderust = { version = "0.11.1", features = ["atmosphere", "photometry"] }

thiserror = "2.0"
bitflags  = "2.13"
chrono    = "0.4"
csv       = "1"
log       = "0.4"
serde     = { version = "1", features = ["derive"] }
toml      = "1.1.2"
serde_json = "1"
sha2 = "0.11"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
toml = "1.1.2"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["html_reports"] }

[[bench]]
name = "threshold_window"
harness = false

[[bench]]
name = "airglow_geometry"
harness = false
