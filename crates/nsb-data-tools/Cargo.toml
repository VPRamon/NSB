[package]
name = "nsb-data-tools"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
license = "AGPL-3.0-only"
autobins = false

[[bin]]
name = "nsb-data"
path = "src/bin/nsb-data.rs"
doc = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
flate2 = "1"
log = "0.4"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1.1.2"
toml_edit = "0.23"

[dev-dependencies]
tempfile = "3"
