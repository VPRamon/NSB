[package]
name = "nsb-data-tools"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
license = "BSD-3-Clause"
autobins = false

[[bin]]
name = "nsb-data"
path = "src/bin/nsb-data.rs"
doc = false

[dependencies]
anyhow = "1"
chrono = "0.4"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
csv = "1"
flate2 = "1"
futures-util = "0.3"
httpdate = "1"
log = "0.4"
md-5 = "0.10"
nsb = { version = "=0.1.0", path = "../nsb" }
qtty = { version = "0.8", features = ["astro", "radiometry"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
siderust = { version = "0.11.0", features = ["atmosphere", "photometry"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "1.1.2"

[dev-dependencies]
tempfile = "3"
