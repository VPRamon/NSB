# Issue #182 Experiment A — true Measured336To650 production re-run (separate
# from the diagnostic combined-candidate-measured-subcomponent export).
#
# Same Gaia/XP inventory and photometric/selection pins as the frozen #182
# combined 300–650 candidate (76191c8b…), but product_band=measured-336-650
# with NO ultraviolet correction. Sources lacking UV predictors are admitted
# when measured-band flux is valid.
#
# Workspace reuses the #182 Gaia object cache via symlink (see setup script).
schema_version = 1
dataset = "starlight"

[workspace]
root = "/mnt/beegfs/valles/nsb-data/starlight-production-336-650-issue182"

[execution]
executor = "slurm"
concurrency = 8
lease_timeout_seconds = 86400

[execution.slurm]
partition = "ladon"
account = "ice-research"
time_limit = "24:00:00"
memory = "32G"
array_parallelism = 8

[starlight]
product_band = "measured-336-650"

[starlight.photometric_inference]
artifact_path = "/mnt/beegfs/valles/nsb-data/starlight-calibration/artifacts/photometric-artifact.json"
sha256 = "02a6e5c98458351fb13ec7623cffa019a760bdf2e68cca64b80f9c5d7fe4f4f2"

[starlight.selection_function]
artifact_path = "/mnt/beegfs/valles/nsb-data/starlight-calibration/artifacts/selection-artifact.json"
sha256 = "1a3670b56eedaf9f9de0b32f081ccfa2baf741a449cd70c2be37d666101a9711"

[starlight.acquisition]
connect_timeout_seconds = 30
request_timeout_seconds = 1800
max_attempts = 5

[starlight.map]
canonical_nside = 128

[[starlight.gaia_products]]
id = "gaia-source"
base_url = "https://cdn.gea.esac.esa.int/Gaia/gdr3/gaia_source/"
checksum_manifest_url = "https://cdn.gea.esac.esa.int/Gaia/gdr3/gaia_source/_MD5SUM.txt"
checksum_manifest_sha256 = "9ec782f9c83b29885924c7d47bba18d70c86b8cbefbc408b19090b6a76e8e369"
checksum_algorithm = "md5"
expected_partitions = 3386
filename_prefix = "GaiaSource_"
filename_suffix = ".csv.gz"

[[starlight.gaia_products]]
id = "xp-continuous"
base_url = "https://cdn.gea.esac.esa.int/Gaia/gdr3/Spectroscopy/xp_continuous_mean_spectrum/"
checksum_manifest_url = "https://cdn.gea.esac.esa.int/Gaia/gdr3/Spectroscopy/xp_continuous_mean_spectrum/_MD5SUM.txt"
checksum_manifest_sha256 = "f23df1ffb45b19fc3f34d6f37791179cef1ebec6c5b9fd613a488b3be580fccd"
