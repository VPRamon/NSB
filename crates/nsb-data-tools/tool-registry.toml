schema_version = 1

# Normative inventory for compiled nsb-data-tools commands. The repository no
# longer contains Python or shell data-product programs.

[[binaries]]
name = "build_starlight_map"
path = "src/bin/build_starlight_map.rs"
owner = "starlight-generation"
audience = "release-maintainer"
status = "supported"
purpose = "Build a deterministic HEALPix Starlight map from a canonical catalogue."
inputs = "Canonical catalogue, map configuration, provenance and checksums."
outputs = "Starlight map and validation diagnostics."
resume = "No implicit resume; output is deterministic from explicit inputs."
exit_codes = "Zero only after complete validated construction."
documentation = "crates/nsb-data-tools/README.md#starlight-generation-and-validation"

[[binaries]]
name = "prepare_tycho_starlight_catalogue"
path = "src/bin/prepare_tycho_starlight_catalogue.rs"
owner = "catalogue-preparation"
audience = "researcher"
status = "experimental"
purpose = "Convert Tycho catalogue rows into the canonical Starlight schema."
inputs = "Tycho catalogue and verified provenance."
outputs = "Canonical catalogue and diagnostics."
resume = "No implicit resume; conversion is deterministic."
exit_codes = "Zero only after schema and checksum validation."
documentation = "crates/nsb-data-tools/README.md#catalogue-preparation"

[[binaries]]
name = "prepare_gaia_starlight_catalogue"
path = "src/bin/prepare_gaia_starlight_catalogue.rs"
