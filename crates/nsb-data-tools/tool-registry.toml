audience = "release-maintainer"
status = "supported"
purpose = "Convert Gaia XP sampled data into canonical Starlight source rows."
inputs = "Official Gaia data, provenance and passband policy."
outputs = "Canonical catalogue, exclusions and diagnostics."
resume = "Streaming conversion with caller-managed verified inputs."
exit_codes = "Zero only when source accounting and provenance pass."
documentation = "crates/nsb-data-tools/README.md#catalogue-preparation"

