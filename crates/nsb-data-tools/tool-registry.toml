schema_version = 2

# Normative inventory of durable nsb-data actions. The suite has one Rust CLI;
# no Python, shell, legacy, phase, or pilot command surfaces are retained.

[[actions]]
command = "assets verify"
owner = "assets"
audience = "release-maintainer"
status = "supported"
purpose = "Verify runtime asset schemas, checksums, headers, and metadata."
inputs = "Asset manifest and registered files."
outputs = "Verification result and process status."
resume = "Read-only deterministic verification."
exit_codes = "Zero only when every registered asset passes."
reference = "docs/specifications/validation.md"

[[actions]]
command = "starlight acquire tap"
owner = "starlight/acquisition"
audience = "release-maintainer"
status = "supported"
purpose = "Execute reproducible Gaia TAP jobs with persisted evidence."
inputs = "ADQL, endpoint, output paths, and retry policy."
outputs = "Verified TAP result and job manifest."
resume = "Explicit resume continues a verified asynchronous job."
exit_codes = "Zero only for a complete verified TAP result."
reference = "docs/nsb_components/starlight/map-generation.md"

[[actions]]
command = "starlight acquire release-inputs"
owner = "starlight/acquisition"
audience = "release-maintainer"
status = "supported"
purpose = "Generate reproducible Gaia release inputs and provenance evidence."
inputs = "Gaia query policy, retrieval configuration, and release metadata."
outputs = "Queries, normalized inputs, checksums, and diagnostics."
resume = "Reuse only explicitly verified persisted inputs."
exit_codes = "Zero only when the acquisition contract is complete."
reference = "docs/nsb_components/starlight/map-generation.md"

[[actions]]
command = "starlight acquire xp-bulk download"
owner = "starlight/acquisition"
audience = "release-maintainer"
status = "supported"
purpose = "Download official Gaia XP continuous bulk partitions with checksums."
inputs = "Official inventory, destination, requested subset, and retry policy."
outputs = "Verified partitions and acquisition manifest."
resume = "Resume reuses checksum-verified partitions only."
exit_codes = "Zero only when the requested inventory is verified."
reference = "docs/nsb_components/starlight/gaia-xp-continuous-rust.md"

[[actions]]
command = "starlight acquire xp-bulk index"
owner = "starlight/acquisition"
audience = "release-maintainer"
status = "supported"
purpose = "Index verified XP continuous partitions for deterministic lookup."
inputs = "Checksum-verified official bulk partitions."
outputs = "Partition and source index with diagnostics."
resume = "Indexes rebuild deterministically from verified inputs."
exit_codes = "Zero only when partition counts reconcile."
reference = "docs/nsb_components/starlight/gaia-xp-continuous-rust.md"

[[actions]]
command = "starlight catalogue prepare-gaia"
owner = "starlight/catalogue"
audience = "release-maintainer"
status = "supported"
purpose = "Convert Gaia XP sampled data into canonical starlight source rows."
inputs = "Official Gaia data, provenance, and passband policy."
outputs = "Canonical catalogue, exclusions, and diagnostics."
resume = "Streaming conversion with caller-managed verified inputs."
exit_codes = "Zero only when source accounting and provenance pass."
reference = "docs/nsb_components/starlight/map-generation.md"

[[actions]]
command = "starlight xp-continuous normalize"
owner = "starlight/xp-continuous"
audience = "release-maintainer"
status = "supported"
purpose = "Normalize Gaia XP continuous records into the canonical Rust schema."
inputs = "Raw coefficient records and source provenance."
outputs = "Canonical coefficient records and accounting manifest."
resume = "Normalization is deterministic; reuse requires verified outputs."
exit_codes = "Zero only for complete schema-valid normalization."
reference = "docs/nsb_components/starlight/gaia-xp-continuous-rust.md"

[[actions]]
command = "starlight xp-continuous reconstruct"
owner = "starlight/xp-continuous"
audience = "release-maintainer"
status = "supported"
purpose = "Reconstruct calibrated XP spectra and photon flux in Rust."
inputs = "Canonical coefficients and frozen design fixture."
outputs = "Normalized spectra and reconstruction manifest."
resume = "Existing outputs require explicit checksum verification."
exit_codes = "Zero only after calibration, integration, and publication succeed."
reference = "docs/nsb_components/starlight/gaia-xp-continuous-rust.md"

[[actions]]
command = "starlight xp-continuous validate"
owner = "starlight/xp-continuous"
audience = "release-maintainer"
status = "supported"
purpose = "Validate XP continuous reconstruction against the scientific contract."
inputs = "Canonical coefficients, reconstruction, provenance, and tolerances."
outputs = "Versioned parity and validation report."
resume = "Read-only deterministic validation."
exit_codes = "Zero only when spectral, flux, uncertainty, and provenance gates pass."
reference = "docs/nsb_components/starlight/gaia-xp-continuous-rust.md"

[[actions]]
command = "starlight sampling generate-queries"
owner = "starlight/sampling"
audience = "release-maintainer"
status = "supported"
purpose = "Generate deterministic stratified Gaia sampling queries."
inputs = "Sampling policy and population definitions."
outputs = "ADQL queries and sampling manifest."
resume = "No implicit resume; regeneration is deterministic."
exit_codes = "Zero only when every required stratum is represented."
reference = "docs/nsb_components/starlight/science-requirements.md"

[[actions]]
command = "starlight sampling consolidate"
owner = "starlight/sampling"
audience = "release-maintainer"
status = "supported"
purpose = "Validate and consolidate Gaia samples into model datasets."
inputs = "Persisted TAP results and split specification."
outputs = "Canonical samples, exclusions, and split diagnostics."
resume = "Completed verified TAP results are reused explicitly."
exit_codes = "Zero only after deduplication and split validation."
reference = "docs/nsb_components/starlight/science-requirements.md"

[[actions]]
command = "starlight map build"
owner = "starlight/map"
audience = "release-maintainer"
status = "supported"
purpose = "Build a deterministic HEALPix starlight map from a canonical catalogue."
inputs = "Canonical catalogue, map configuration, provenance, and checksums."
outputs = "Starlight map and validation diagnostics."
resume = "No implicit resume; output is deterministic from explicit inputs."
exit_codes = "Zero only after complete validated construction."
reference = "docs/nsb_components/starlight/map-generation.md"

[[actions]]
command = "starlight map sweep"
owner = "starlight/map"
audience = "release-maintainer"
status = "supported"
purpose = "Evaluate starlight candidates across HEALPix resolutions."
inputs = "Canonical catalogue or verified candidate artefacts."
outputs = "Candidate artefacts and sweep summary."
resume = "Assessment mode reuses explicitly verified artefacts."
exit_codes = "Zero only when requested candidate or production gates pass."
reference = "docs/nsb_components/starlight/map-validation.md"

[[actions]]
command = "starlight map validate"
owner = "starlight/map"
audience = "release-maintainer"
status = "supported"
purpose = "Validate a map against scientific and independent-reference contracts."
inputs = "Map, provenance, policy, and validation references."
outputs = "Versioned validation report."
resume = "Read-only deterministic validation."
exit_codes = "Zero only when requested validation gates pass."
reference = "docs/nsb_components/starlight/map-validation.md"

[[actions]]
command = "starlight quality audit-exclusions"
owner = "starlight/quality"
audience = "release-maintainer"
status = "supported"
purpose = "Audit scientific exclusions against source accounting."
inputs = "Canonical catalogue, exclusions sidecar, and checksums."
outputs = "Versioned exclusion audit report."
resume = "Read-only deterministic audit."
exit_codes = "Zero only when every exclusion is justified and reconciled."
reference = "docs/nsb_components/starlight/map-validation.md"

[[actions]]
command = "starlight product build-integrated"
owner = "starlight/product"
audience = "release-maintainer"
status = "supported"
purpose = "Build an integrated starlight candidate from approved contributions."
inputs = "Population contributions, policies, and provenance."
outputs = "Integrated candidate and admission evidence."
resume = "Reusable persisted inputs are supplied explicitly."
exit_codes = "Zero only for the requested candidate or production condition."
reference = "docs/nsb_components/starlight/map-generation.md"

[[actions]]
command = "starlight release pack-asset"
owner = "starlight/release"
audience = "release-maintainer"
status = "supported"
purpose = "Package a validated starlight map and runtime manifest."
inputs = "Validated map and complete release evidence."
outputs = "Runtime asset and manifest."
resume = "No implicit resume; packaging is deterministic."
exit_codes = "Zero only after release admission checks pass."
reference = "docs/nsb_components/starlight/external-manifest.md"

[[actions]]
command = "maintenance render-tool-reference"
owner = "tooling/maintenance"
audience = "maintainer"
status = "supported"
purpose = "Render the checked-in tool reference from this registry."
inputs = "Normative tool registry."
outputs = "Maintainer tool reference Markdown."
resume = "Deterministic render; --check is read-only."
exit_codes = "Zero only when the reference is current or successfully written."
reference = "docs/maintainer-guide/tools.md"
