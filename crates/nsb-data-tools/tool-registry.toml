schema_version = 1

# Normative inventory for every compiled nsb-data-tools binary.
# Status values:
# - supported: durable maintainer capability with a stable operational contract
# - experimental: real capability whose scientific or operational contract is not production approved
# - migration-only: transitional command retained for reproducibility or by a current orchestrator
# - test-only: compiled test helper, never a supported product command

[[binaries]]
name = "build_starlight_map"
path = "src/bin/build_starlight_map.rs"
owner = "starlight-generation"
audience = "release-maintainer"
status = "supported"
purpose = "Generate a deterministic HEALPix starlight map from a canonical source catalogue using Siderust-owned coordinate and HEALPix primitives."
inputs = "Canonical source catalogue, explicit HEALPix configuration, catalogue provenance and checksums."
outputs = "HEALPix CSV data product and optional versioned diagnostics report."
resume = "No implicit resume; generation is deterministic and output replacement must be intentional."
exit_codes = "Zero only after parsing, map construction and required validation succeed; non-zero on malformed input, inconsistent accounting or I/O failure."
documentation = "docs/maintainer-guide/tools.md#build_starlight_map"

[[binaries]]
name = "prepare_tycho_starlight_catalogue"
path = "src/bin/prepare_tycho_starlight_catalogue.rs"
owner = "catalogue-preparation"
audience = "researcher"
status = "experimental"
purpose = "Convert local Tycho BT/VT rows into the canonical starlight source schema for controlled experiments."
inputs = "Local Tycho catalogue, verified checksum and explicit catalogue metadata."
outputs = "Canonical source catalogue and diagnostics."
resume = "No resume; deterministic full conversion."
exit_codes = "Zero only for a complete validated conversion; non-zero on checksum, schema, coordinate or photometry failure."
documentation = "docs/maintainer-guide/tools.md#prepare_tycho_starlight_catalogue"

[[binaries]]
name = "prepare_gaia_starlight_catalogue"
path = "src/bin/prepare_gaia_starlight_catalogue.rs"
owner = "catalogue-preparation"
audience = "release-maintainer"
status = "supported"
purpose = "Convert official Gaia DR3 XP sampled bulk data or a normalized controlled fallback into canonical passband-integrated starlight source rows."
inputs = "Official Gaia XP sampled inventory or normalized fallback, provenance, passband and output policy."
outputs = "Canonical source catalogue, exclusions sidecar and versioned diagnostics."
resume = "Streaming conversion; exclusions-only mode may regenerate evidence without replacing a validated catalogue."
exit_codes = "Zero only when source accounting, checksums and requested production requirements pass."
documentation = "docs/maintainer-guide/tools.md#prepare_gaia_starlight_catalogue"

[[binaries]]
name = "validate_starlight_map"
path = "src/bin/validate_starlight_map.rs"
owner = "starlight-validation"
audience = "release-maintainer"
status = "supported"
purpose = "Validate a generated starlight map against structural, scientific and independent-reference requirements."
inputs = "Generated map, provenance metadata, scientific policy and validation reference."
outputs = "Versioned validation report with pass, fail, not-run and blocker evidence."
resume = "Not applicable; validation is read-only and deterministic."
exit_codes = "Zero only when the requested validation policy passes; non-zero for invalid maps, missing evidence or failed gates."
documentation = "docs/maintainer-guide/tools.md#validate_starlight_map"

[[binaries]]
name = "pack_starlight_asset"
path = "src/bin/pack_starlight_asset.rs"
owner = "asset-release"
audience = "release-maintainer"
status = "supported"
purpose = "Package a validated starlight map and runtime manifest without weakening candidate or production admission policy."
inputs = "Validated map, validation evidence, catalogue provenance and requested maturity."
outputs = "Runtime HEALPix asset and manifest suitable for review or release."
resume = "No resume; packaging is deterministic from immutable inputs."
exit_codes = "Zero only after checksum, metadata and maturity-policy validation; non-zero when production evidence is incomplete."
documentation = "docs/maintainer-guide/tools.md#pack_starlight_asset"

[[binaries]]
name = "verify_assets"
path = "src/bin/verify_assets.rs"
owner = "asset-release"
audience = "external-user-and-release-maintainer"
status = "supported"
purpose = "Verify the NSB scientific asset registry, schemas, checksums, required metadata and file coverage."
inputs = "Runtime asset manifest and referenced repository assets."
outputs = "Human-readable verification result and process exit status."
resume = "Not applicable; read-only verification."
exit_codes = "Zero only when every registered asset passes; non-zero on missing files, checksum mismatch, schema error or incomplete coverage."
documentation = "docs/maintainer-guide/tools.md#verify_assets"

[[binaries]]
name = "sweep_starlight_nside"
path = "src/bin/sweep_starlight_nside.rs"
owner = "starlight-validation"
audience = "release-maintainer"
status = "supported"
purpose = "Build or reassess starlight candidates across HEALPix resolutions while separating candidate recommendation from production admission."
inputs = "Canonical catalogue or persisted sweep artifacts, checksums and validation references."
outputs = "Per-resolution artifacts and a versioned sweep summary."
resume = "Assess-existing mode reevaluates persisted artifacts without rebuilding maps."
exit_codes = "Zero when the requested candidate or production condition is satisfied; non-zero when explicitly required gates fail."
documentation = "docs/maintainer-guide/tools.md#sweep_starlight_nside"

[[binaries]]
name = "generate_gaia_starlight_release_inputs"
path = "src/bin/generate_gaia_starlight_release_inputs.rs"
owner = "gaia-acquisition"
audience = "release-maintainer"
status = "supported"
purpose = "Generate the Gaia DR3 metadata query, retrieve or merge normalized XP inputs, verify provenance and emit downstream release configuration."
inputs = "Gaia query policy, output directory, retrieval mode, license policy and validation reference."
outputs = "ADQL, metadata, normalized chunks, diagnostics, checksums and release-input configuration."
resume = "Explicit resume preserves only verified downloads and normalized chunks."
exit_codes = "Zero only when the requested acquisition contract is complete; production fails closed on missing products or provenance."
documentation = "docs/maintainer-guide/tools.md#generate_gaia_starlight_release_inputs"

[[binaries]]
name = "query_gaia_tap"
path = "src/bin/query_gaia_tap.rs"
owner = "gaia-acquisition"
audience = "release-maintainer"
status = "supported"
purpose = "Execute reproducible Gaia TAP jobs with persisted manifests, retries, diagnostics and resumable result retrieval."
inputs = "ADQL query, TAP endpoint policy, output paths and retry configuration."
outputs = "TAP result, request/status evidence and versioned manifest."
resume = "Explicit resume continues a persisted asynchronous job or reuses a verified result."
exit_codes = "Zero only for a complete verified result; non-zero for terminal service errors, invalid schema or exhausted retries."
documentation = "docs/maintainer-guide/tools.md#query_gaia_tap"

[[binaries]]
name = "export_starlight_healpix_to_contributions"
path = "src/bin/export_starlight_healpix_to_contributions.rs"
owner = "starlight-integration"
audience = "researcher-and-release-maintainer"
status = "experimental"
purpose = "Convert a runtime HEALPix map into normalized contribution rows and an input manifest for controlled integrated-product candidate work."
inputs = "Runtime map, nside, branch identity, optional diagnostics and uncertainty assumptions."
outputs = "Contribution CSV, input manifest and optional coverage metadata."
resume = "No implicit resume; deterministic full export to caller-selected paths."
exit_codes = "Zero only when map structure, indices, radiance values and output checksums are valid."
documentation = "docs/maintainer-guide/tools.md#export_starlight_healpix_to_contributions"

[[binaries]]
name = "build_integrated_starlight_product"
path = "src/bin/build_integrated_starlight_product.rs"
owner = "starlight-integration"
audience = "release-maintainer"
status = "supported"
purpose = "Build an integrated starlight candidate from approved population contributions and report explicit production blockers."
inputs = "Population contributions, frozen policies, validation references, provenance and output configuration."
outputs = "Integrated candidate map, diagnostics, approval evidence and release metadata."
resume = "No hidden resume; reusable persisted inputs are supplied explicitly."
exit_codes = "Zero only for the requested candidate or production condition; production admission fails closed."
documentation = "docs/maintainer-guide/tools.md#build_integrated_starlight_product"

[[binaries]]
name = "generate_starlight_sample_queries"
path = "src/bin/generate_starlight_sample_queries.rs"
owner = "starlight-sampling"
audience = "release-maintainer"
status = "supported"
purpose = "Generate deterministic stratified Gaia sampling queries from the versioned starlight science contract."
inputs = "Sampling policy, population definitions and output directory."
outputs = "ADQL query set and versioned sampling manifest."
resume = "No resume; deterministic regeneration is expected."
exit_codes = "Zero only when every required stratum has a generated query and consistent manifest."
documentation = "docs/maintainer-guide/tools.md#generate_starlight_sample_queries"

[[binaries]]
name = "consolidate_gaia_starlight_samples"
path = "src/bin/consolidate_gaia_starlight_samples.rs"
owner = "starlight-sampling"
audience = "release-maintainer"
status = "supported"
purpose = "Validate, deduplicate and spatially split completed Gaia sampling results into canonical modelling datasets."
inputs = "Persisted TAP job manifests/results and the frozen split specification."
outputs = "Consolidated canonical samples, inventory, exclusions and split diagnostics."
resume = "Reruns reuse verified completed TAP results and recompute consolidation deterministically."
exit_codes = "Zero only after required-stratum, deduplication, source-accounting and split validation."
documentation = "docs/maintainer-guide/tools.md#consolidate_gaia_starlight_samples"

[[binaries]]
name = "normalize_xp_continuous_coefficients"
path = "src/bin/normalize_xp_continuous_coefficients.rs"
owner = "gaia-xp-continuous"
audience = "release-maintainer"
status = "supported"
purpose = "Normalize official or DataLink Gaia XP continuous coefficient records into the versioned canonical Rust schema."
inputs = "Raw Gaia XP continuous records and source provenance."
outputs = "Canonical coefficient records and manifest with exact rejection accounting."
resume = "Existing outputs may be reused only after callers verify their manifest and checksums; normalization itself is deterministic."
exit_codes = "Zero only for complete schema-valid normalization; non-zero on dimension, correlation, provenance or checksum failure."
documentation = "docs/maintainer-guide/tools.md#normalize_xp_continuous_coefficients"

[[binaries]]
name = "validate_xp_continuous_reconstruction"
path = "src/bin/validate_xp_continuous_reconstruction.rs"
owner = "gaia-xp-continuous"
audience = "release-maintainer"
status = "supported"
purpose = "Validate reconstructed Gaia XP continuous spectra, integrated photon flux and uncertainty against the frozen scientific contract."
inputs = "Canonical coefficients, reconstructed output, calibration provenance and tolerances."
outputs = "Versioned parity and validation report."
resume = "Not applicable; read-only deterministic validation."
exit_codes = "Zero only when spectral, integrated-flux, uncertainty and provenance tolerances pass."
documentation = "docs/maintainer-guide/tools.md#validate_xp_continuous_reconstruction"

[[binaries]]
name = "download_gaia_xp_continuous_bulk"
path = "src/bin/download_gaia_xp_continuous_bulk.rs"
owner = "gaia-acquisition"
audience = "release-maintainer"
status = "supported"
purpose = "Download official Gaia DR3 XP continuous bulk partitions with retries, inventory checksums and resumable storage."
inputs = "Official bulk inventory, destination, storage policy and retry configuration."
outputs = "Verified bulk partitions and acquisition manifest."
resume = "Explicit resume reuses only checksum-verified partitions and continues incomplete downloads."
exit_codes = "Zero only when the requested inventory subset is checksum verified."
documentation = "docs/maintainer-guide/tools.md#download_gaia_xp_continuous_bulk"

[[binaries]]
name = "train_starlight_photometry_models"
path = "src/bin/train_starlight_photometry_models.rs"
owner = "starlight-modelling"
audience = "researcher"
status = "experimental"
purpose = "Train and evaluate candidate starlight photometry models from frozen, spatially split Gaia samples."
inputs = "Canonical train/validation/test samples and versioned modelling policy."
outputs = "Candidate model coefficients, diagnostics and holdout metrics."
resume = "No implicit resume; training is deterministic for fixed policy and input checksums."
exit_codes = "Zero only when dataset validation and requested model checks pass; output remains experimental until independently approved."
documentation = "docs/maintainer-guide/tools.md#train_starlight_photometry_models"

[[binaries]]
name = "index_gaia_xp_continuous_bulk"
path = "src/bin/index_gaia_xp_continuous_bulk.rs"
owner = "gaia-acquisition"
audience = "release-maintainer"
status = "supported"
purpose = "Index official Gaia XP continuous bulk partitions for deterministic source lookup and partition planning."
inputs = "Checksum-verified official bulk partitions."
outputs = "Versioned partition/source index and diagnostics."
resume = "Verified index partitions may be reused; rebuilding is deterministic."
exit_codes = "Zero only when all indexed partitions and counts reconcile with the input inventory."
documentation = "docs/maintainer-guide/tools.md#index_gaia_xp_continuous_bulk"

[[binaries]]
name = "audit_gaia_starlight_exclusions"
path = "src/bin/audit_gaia_starlight_exclusions.rs"
owner = "starlight-validation"
audience = "release-maintainer"
status = "supported"
purpose = "Audit Gaia starlight scientific exclusions against the canonical source inventory and documented rejection policy."
inputs = "Canonical catalogue, exclusions sidecar and source checksums."
outputs = "Versioned exclusion audit report and exact reconciliation evidence."
resume = "Not applicable; read-only deterministic audit."
exit_codes = "Zero only when every exclusion is justified, unique and reconciled with the source inventory."
documentation = "docs/maintainer-guide/tools.md#audit_gaia_starlight_exclusions"

[[binaries]]
name = "finalize_phase5_holdout_v1"
path = "src/bin/finalize_phase5_holdout_v1.rs"
owner = "historical-phase5-validation"
audience = "maintainer"
status = "migration-only"
purpose = "Reproduce the frozen Phase 5 holdout-v1 download, normalization, Rust reconstruction, independence and preflight evidence."
inputs = "Frozen Phase 5 policy, holdout manifests, raw coefficients, canonical catalogue, exclusions and repository checkout."
outputs = "Historical holdout reconciliation, reconstruction and preflight reports."
resume = "Reuses existing frozen manifests and outputs where explicitly verified; not a template for new releases."
exit_codes = "Zero only when the frozen holdout workflow reconciles and passes its preflight contract."
documentation = "docs/maintainer-guide/tools.md#transitional-commands"

[[binaries]]
name = "run_phase5b_chunk_benchmark"
path = "src/bin/run_phase5b_chunk_benchmark.rs"
owner = "gaia-xp-continuous-migration"
audience = "maintainer"
status = "migration-only"
purpose = "Benchmark batch sizes for the transitional Phase 5B mini-pilot implementation."
inputs = "One XP continuous bulk partition, row limit, candidate chunk sizes and worker count."
outputs = "Per-chunk throughput/RSS measurements and a selected chunk size."
resume = "No resume; each benchmark invokes fresh mini-pilot outputs."
exit_codes = "Zero only when every requested benchmark run completes and metrics are readable."
documentation = "docs/maintainer-guide/tools.md#transitional-commands"

[[binaries]]
name = "run_phase5b_mini_pilot"
path = "src/bin/run_phase5b_mini_pilot.rs"
owner = "gaia-xp-continuous-migration"
audience = "maintainer"
status = "migration-only"
purpose = "Stream a bounded XP continuous bulk partition through canonical parsing, pure-Rust calibration and HEALPix accumulation with checkpoints."
inputs = "Bulk ECSV gzip, calibration fixture, output directory, limits, worker and checkpoint policy."
outputs = "Checkpoint, HEALPix accumulator, exclusions, reconstructed outputs and metrics."
resume = "Explicit resume validates checkpoint identity and continues from the persisted row."
exit_codes = "Zero only when streamed rows, checkpoints, reconstruction and HEALPix state remain consistent."
documentation = "docs/maintainer-guide/tools.md#transitional-commands"

[[binaries]]
name = "run_starlight_xp_continuous_bulk_pipeline"
path = "src/bin/run_starlight_xp_continuous_bulk_pipeline.rs"
owner = "gaia-xp-continuous-bulk"
audience = "release-maintainer"
status = "experimental"
purpose = "Orchestrate storage preflight, official inventory checks, rehearsal, resume validation, partition processing, reconciliation, merge and controlled cleanup for XP continuous bulk production."
inputs = "Workspace/storage layout, official checksum inventory, calibration policy, cache configuration and execution limits."
outputs = "Storage plan, session manifest, rehearsal and production reports, partition reconciliation and merged HEALPix state."
resume = "Explicit resume reuses only verified cache, checkpoint and reconciliation state."
exit_codes = "Zero only when all requested preflight and processing gates pass; experimental status remains until the orchestration boundary is fully capability-oriented."
documentation = "docs/maintainer-guide/tools.md#run_starlight_xp_continuous_bulk_pipeline"

[[binaries]]
name = "reconstruct_canonical_coefficients"
path = "src/bin/reconstruct_canonical_coefficients.rs"
owner = "gaia-xp-continuous"
audience = "release-maintainer"
status = "supported"
purpose = "Reconstruct normalized 336-650 nm spectra and integrated photon flux from canonical XP continuous coefficient CSVs using the in-process Rust calibrator."
inputs = "Canonical coefficient file or directory, calibration/design fixture and output policy."
outputs = "Normalized spectra where requested and a versioned reconstruction manifest with flux, uncertainty and checksums."
resume = "Existing per-source outputs are skipped only when present; callers must verify the resulting manifest and checksums."
exit_codes = "Zero only when every selected record parses, calibrates, integrates and is recorded in the manifest."
documentation = "docs/maintainer-guide/tools.md#reconstruct_canonical_coefficients"