[package]
name = "nsb-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
license = "AGPL-3.0-only"


[[bin]]
name = "nsb"
path = "src/main.rs"
doc = false

[dependencies]
nsb = { version = "=0.1.0", path = "../nsb" }

anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = "0.4"
csv = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
toml = "1.1.2"

tempoch = "0.7"
# Pre-release integration pin: replace with the crates.io 0.12 release after PR #97 lands.
siderust = { version = "0.12.0", git = "https://github.com/Siderust/siderust", branch = "96-specialize-icrs-altitude-events", features = ["atmosphere", "photometry"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
