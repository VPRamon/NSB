[package]
name = "nsb-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
license = "BSD-3-Clause"

[[bin]]
name = "nsb"
path = "src/main.rs"
doc = false

[dependencies]
nsb = { version = "=0.1.0", path = "../nsb" }

anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = "0.4"
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
toml = "1.1.2"

qtty = { version = "0.8", features = ["radiometry", "astro", "photometry"] }
tempoch = "0.6"
siderust = { version = "=0.10.1", git = "https://github.com/Siderust/siderust.git", rev = "8d94b8375ae23c26d00346f74951e52cd1b595cc", features = ["atmosphere", "photometry"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
