[package]
name = "nsb-cli"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "nsb"
path = "src/main.rs"

[dependencies]
nsb = { path = "../.." }

anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = "0.4"
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
toml = "0.9"

qtty = { version = "0.8", features = ["radiometry", "astro", "photometry"] }
tempoch = "0.6"
siderust = { version = "0.10", features = ["atmosphere", "photometry"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
