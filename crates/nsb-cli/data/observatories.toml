#
# NSB bundled observatory extensions in Siderust's canonical [[observatory]]
# format. These records are composed onto ObservatoryCatalog::builtin() at
# runtime; they do not replace Siderust's generic catalog and must not redefine
# any exact Siderust observatory name.
#
# A catalog entry is only an observing location (WGS84 geodetic position plus
# reference atmosphere). NSB scientific assumptions remain a separate
# --site-profile / SiteProfileId concern. Inclusion here does not imply a
# site-calibrated NSB model.
#
# Longitude and latitude are WGS84 geodetic degrees. Height is WGS84 ellipsoidal
# metres. Pressure is hPa. Temperature (K) and relative humidity ([0, 1]) are
# optional.

[[observatory]]
# Array coordinates: CTAO-South site documentation (DMS → decimal degrees).
# CTA literature reports a nominal 2150 m above-sea-level altitude. Because no
# WGS84 ellipsoidal datum is stated, treat 2150 m as orthometric height H and
# convert with the EGM96 15' geoid undulation N = +34.6407 m:
# h(WGS84) = H + N = 2184.6407 m, rounded to 2184.6 m.
# Pressure: ISA troposphere estimate at H = 2150 m ≈ 780 hPa.
# Sources:
#   https://www.ctao.org/emission-to-discovery/array-sites/ctao-south/
#   https://pos.sissa.it/358/733/pdf
name = "CTAO South"
longitude_deg = -70.31634444444444
latitude_deg = -24.683427777777776
height_m = 2184.6
reference_pressure_hpa = 780.0

[[observatory]]
