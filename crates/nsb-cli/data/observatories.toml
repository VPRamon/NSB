[[site]]
canonical_alias = "FAST"
display_name = "Five-hundred-meter Aperture Spherical Telescope"
# Public sources agree on the present Dawodang coordinates. Project literature
# reports the site altitude at approximately 1000 m, so the height is intentionally
# not given false sub-metre precision.
lon_deg = 106.856667
lat_deg = 25.653056
height_m = 1000.0
aliases = ["FAST", "TIANYAN", "FIVE-HUNDRED-METER-APERTURE-SPHERICAL-TELESCOPE"]
source_urls = [
  "https://lssf.cas.cn/en/facilities/sa/fast/202505/t20250528_5070737.html",
  "https://science.nasa.gov/photojournal/five-hundred-meter-aperture-spherical-telescope-china/",
  "https://www.sciengine.com/doi/pdfView/c402589c5c0642c5bd2a5c8dd5b8c32d",
]

