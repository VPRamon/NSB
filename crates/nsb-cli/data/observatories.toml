#
# NSB-owned named observing sites used by the CLI. This is deliberately separate
# from Siderust's bundled observatory catalog: Siderust provides coordinate types,
# while NSB decides which facilities are useful to expose as built-in CLI sites.
#
# `height_m` is the representative site/telescope altitude reported by the cited
# source. It preserves the existing CLI contract, whose explicit `--height` input
# is also expressed in metres. Site-specific atmospheric calibration remains a
# separate NSB `SiteProfile`; a catalog entry is only an observing location.

[[site]]
canonical_alias = "CTAO-S"
display_name = "CTAO South"
lon_deg = -70.31634444444444
lat_deg = -24.683427777777776
height_m = 2150.0
aliases = ["CTAO-S", "CTA-S", "CTAO-SOUTH", "CTA-SOUTH"]
source_urls = [
  "https://www.ctao.org/emission-to-discovery/array-sites/ctao-south/",
  "https://pos.sissa.it/358/733/pdf",
]

