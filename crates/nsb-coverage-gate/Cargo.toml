[package]
name = "nsb-coverage-gate"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
license = "AGPL-3.0-only"
description = "Local coverage floors and changed-production-code gates for NSB CI."

[[bin]]
name = "nsb-coverage-gate"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.2"
thiserror = "2.0"
