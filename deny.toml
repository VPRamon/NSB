[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Siderust 0.12.0 uses `paste`; RUSTSEC-2024-0436 is an unmaintained notice,
# not a vulnerability, and no compatible upstream replacement is available yet.
# Criterion's plotting stack uses `ttf-parser`; RUSTSEC-2026-0192 is likewise
# an unmaintained notice with no safe upgrade and affects dev-only tooling.
ignore = ["RUSTSEC-2024-0436", "RUSTSEC-2026-0192"]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    # siderust-py and tempoch-py still publish the deprecated SPDX spelling.
    # It denotes the same AGPL v3 family as this AGPL-3.0-only workspace.
    "AGPL-3.0",
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # Native GUI clipboard support on Windows uses Boost-licensed crates.
    "BSL-1.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    # egui's embedded default fonts include Hack/Noto Emoji and Ubuntu Light.
    "OFL-1.1",
    "Unicode-3.0",
    "Ubuntu-font-1.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/Siderust/siderust"]
