[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Siderust 0.15.0 uses `paste`; RUSTSEC-2024-0436 is an unmaintained notice,
# not a vulnerability, and no compatible upstream replacement is available yet.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    # siderust-py and tempoch-py still publish the deprecated SPDX spelling.
    # It denotes the same AGPL v3 family as this AGPL-3.0-only workspace.
    "AGPL-3.0",
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
