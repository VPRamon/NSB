[package]
name = "nsb"
version = "0.1.0"
edition = "2021"
authors = ["VPRamon <vallespuigramon@gmail.com>"]
description = "Night Sky Background model — Rust port of the CTAO darknsb Python package."
license = "BSD-3-Clause"
repository = "https://github.com/VPRamon/NSB"
readme = "README.md"
keywords = ["astronomy", "atmosphere", "sky-brightness", "ctao", "nsb"]
categories = ["science"]

[lib]
name = "nsb"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Build PyO3 bindings; combine with maturin to produce a Python wheel.
python = ["dep:pyo3"]
serde = ["dep:serde"]

[dependencies]
qtty     = { path = "../qtty/qtty", features = ["radiometry", "astro", "photometry"] }
tempoch  = { path = "../tempoch/tempoch" }
siderust = { path = "../siderust", features = ["spectra", "tables", "atmosphere"] }
affn     = { path = "../affn" }
cheby    = { path = "../cheby" }
chrono    = "0.4"
thiserror = "1"
bitflags = "2"
pyo3 = { version = "0.22", optional = true, features = ["extension-module"] }
serde = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
approx = "0.5"
serde_json = "1"
anyhow = "1"

[[example]]
name = "ctaos_sgr_a"
path = "examples/ctaos_sgr_a.rs"

[patch.crates-io]
qtty       = { path = "../qtty/qtty" }
qtty-core  = { path = "../qtty/qtty-core" }
qtty-derive = { path = "../qtty/qtty-derive" }
tempoch    = { path = "../tempoch/tempoch" }
affn       = { path = "../affn" }
cheby      = { path = "../cheby" }
