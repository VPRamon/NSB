[package]
name = "nsb"
version = "0.1.0"
edition = "2021"
authors = ["VPRamon <vallespuigramon@gmail.com>"]
description = "Night Sky Background model and CLI."
license = "BSD-3-Clause"
repository = "https://github.com/VPRamon/NSB"
readme = "README.md"
keywords = ["astronomy", "atmosphere", "sky-brightness", "ctao", "nsb"]
categories = ["science"]

[lib]
name = "nsb"

[[bin]]
name = "nsb"
path = "src/bin/nsb.rs"

[dependencies]
qtty     = { path = "../qtty/qtty", features = ["radiometry", "astro", "photometry"] }
tempoch  = { path = "../tempoch/tempoch" }
siderust = { path = "../siderust", features = ["spectra", "tables", "atmosphere"] }
affn     = { path = "../affn" }
cheby    = { path = "../cheby" }
chrono    = "0.4"
thiserror = "1"
bitflags  = "2"
clap      = { version = "4", features = ["derive"] }
anyhow    = "1"

[dev-dependencies]
approx = "0.5"

[patch.crates-io]
qtty       = { path = "../qtty/qtty" }
qtty-core  = { path = "../qtty/qtty-core" }
qtty-derive = { path = "../qtty/qtty-derive" }
tempoch    = { path = "../tempoch/tempoch" }
affn       = { path = "../affn" }
cheby      = { path = "../cheby" }
